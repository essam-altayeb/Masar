/* =====================================================================
   مسار — التصميم
   أسود قهوي + ذهبي معدني (هوية مكتب الطيب) على خلفية رخامية رمادية
   ===================================================================== */
:root{
  --espresso:#1c1a17; --espresso-2:#262320; --espresso-3:#34302a;
  --cream:#f2ead8; --cream-2:#cdbb95;
  --gold:#b8873b; --gold-hi:#e7cb86; --gold-deep:#8a6424; --gold-soft:#f4ecd9; --gold-line:#dcc48f;
  --gold-grad:linear-gradient(135deg,#ecd393 0%,#c9a15b 46%,#9a7330 100%);
  --bg:#eeedea; --paper:#ffffff; --paper-2:#f7f6f2; --line:#dedad2; --line-2:#ebe8e1;
  --ink:#1c1a17; --ink-2:#57524a; --ink-3:#8a8478;
  --ok:#2e7d5b; --warn:#b26b12; --bad:#a8432f; --info:#2f5f86; --wa:#1d9a52;
  --shadow-1:0 1px 2px rgba(28,26,23,.07),0 0 0 1px rgba(28,26,23,.03);
  --shadow-2:0 18px 50px rgba(28,26,23,.22);
  --r-s:8px; --r-m:12px; --r-l:18px;
  --top-h:56px; --nav-h:62px;
  --font:'Plex',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121110; --paper:#1b1a18; --paper-2:#22201d; --line:#35312b; --line-2:#2b2824;
    --ink:#f1ece2; --ink-2:#c3bbab; --ink-3:#8f887b;
    --gold-deep:#d9b46a; --gold-soft:#2c2619; --gold-line:#6b5631;
    --shadow-1:0 0 0 1px rgba(255,255,255,.04); --shadow-2:0 18px 50px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121110; --paper:#1b1a18; --paper-2:#22201d; --line:#35312b; --line-2:#2b2824;
  --ink:#f1ece2; --ink-2:#c3bbab; --ink-3:#8f887b;
  --gold-deep:#d9b46a; --gold-soft:#2c2619; --gold-line:#6b5631;
  --shadow-1:0 0 0 1px rgba(255,255,255,.04); --shadow-2:0 18px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;overflow-x:clip;font-family:var(--font);font-size:15px;line-height:1.6;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold-deep);text-decoration:none}
img{max-width:100%}
.num,.ltr{direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
::selection{background:var(--gold-hi);color:var(--espresso)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- الهيكل ---------- */
.shell{min-height:100dvh;display:flex}
.side{display:none}
.main{flex:1;min-width:0;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px)}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;height:calc(var(--top-h) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;background:var(--espresso);color:var(--cream)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand img{width:34px;height:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.brand-name{font-family:'Ruqaa',var(--font);font-weight:700;font-size:25px;line-height:1;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-top:4px}
.brand-sub{font-size:11px;color:var(--cream-2);line-height:1.2;white-space:nowrap}
.topbar .grow{flex:1}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:999px;border:0;background:transparent;color:inherit}
.icon-btn:hover{background:rgba(127,127,127,.12)}
.topbar .icon-btn{color:var(--cream)}
.page{max-width:1100px;margin:0 auto;padding:16px 14px}
.page-head{display:flex;align-items:center;gap:10px;margin:2px 0 14px;flex-wrap:wrap}
.page-head h1{font-size:22px;line-height:1.3;margin:0;font-weight:700;flex:1;min-width:0}
.page-head .sub{color:var(--ink-3);font-size:13px;width:100%;margin-top:-6px}

.bottomnav{position:fixed;inset-inline:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--paper);border-top:1px solid var(--line)}
.nav-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nav-h);border:0;background:none;color:var(--ink-3);font-size:11px;font-weight:500}
.nav-item.on{color:var(--ink)}
.nav-item.on svg{color:var(--gold)}
.nav-item .badge{position:absolute;top:6px;inset-inline-start:calc(50% + 6px)}
.fab{justify-self:center;align-self:start;margin-top:-18px;width:58px;height:58px;border-radius:50%;border:3px solid var(--paper);background:var(--espresso);color:var(--gold-hi);display:grid;place-items:center;box-shadow:0 8px 20px rgba(28,26,23,.35)}
.fab svg{width:26px;height:26px}
:root[data-theme="dark"] .fab{background:var(--gold-grad);color:var(--espresso)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fab{background:var(--gold-grad);color:var(--espresso)}}

@media (min-width:960px){
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100dvh;width:250px;flex:none;padding:22px 14px 16px;background:var(--espresso);color:var(--cream);overflow-y:auto}
  .side .brand{padding:0 8px 18px;border-bottom:1px solid rgba(231,203,134,.16);margin-bottom:10px}
  .side .brand img{width:44px}
  .side .brand-name{font-size:32px}
  .side-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#d8ccb2;border:0;background:none;width:100%;text-align:start;font-weight:500}
  .side-link:hover{background:var(--espresso-2);color:var(--cream)}
  .side-link.on{background:var(--espresso-3);color:#fff}
  .side-link.on svg{color:var(--gold-hi)}
  .side-link .badge{margin-inline-start:auto}
  .side .add{margin:6px 0 12px;justify-content:center}
  .side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid rgba(231,203,134,.16)}
  .side .me .who{min-width:0;flex:1}
  .side .me .who b{display:block;font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side .me .who span{font-size:12px;color:var(--cream-2)}
  .topbar,.bottomnav{display:none}
  .toast-wrap{top:18px}
  .main{padding-bottom:40px}
  .page{padding:28px 32px}
  .page-head h1{font-size:26px}
}

/* ---------- عناصر عامة ---------- */
.card{background:var(--paper);border-radius:var(--r-l);box-shadow:var(--shadow-1);padding:16px}
.card + .card,.stack > * + *{margin-top:12px}
.card-title{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;font-weight:700}
.card-title .grow{flex:1}
.card-title a,.link-btn{font-size:13px;font-weight:500;color:var(--gold-deep);background:none;border:0;padding:0}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.grid > *,.stack > *{min-width:0}
@media (min-width:760px){.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.main-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap;transition:transform .06s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--espresso);border-color:var(--espresso);color:var(--gold-hi)}
.btn.gold{background:var(--gold-grad);border:0;color:var(--espresso);box-shadow:0 4px 14px rgba(154,115,48,.28)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
:root[data-theme="dark"] .btn.primary{background:var(--gold-grad);color:var(--espresso);border:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--gold-grad);color:var(--espresso);border:0}}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(120px,100%),1fr));gap:8px}

.field{display:block;margin-bottom:12px}
.field > span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
.input,.select,.textarea{width:100%;min-width:0;min-height:44px;padding:10px 12px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--paper);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.textarea{min-height:120px;resize:vertical;line-height:1.75}
.input:focus,.select:focus,.textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
.input::placeholder,.textarea::placeholder{color:var(--ink-3)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.hint{font-size:12px;color:var(--ink-3);margin-top:4px}
.err{color:var(--bad);font-size:13px;margin:6px 0}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);font-size:13px;font-weight:500}
.chip.on{background:var(--espresso);border-color:var(--espresso);color:var(--gold-hi)}
:root[data-theme="dark"] .chip.on{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold-hi)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold-hi)}}
.chip .n{font-size:11px;opacity:.75}
.chip svg{width:15px;height:15px}

.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;color:color-mix(in srgb,var(--c) 82%,var(--ink));background:color-mix(in srgb,var(--c) 14%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:1}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3)}
.tag svg{width:14px;height:14px}

.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--espresso);background:linear-gradient(160deg,#efe2c2,#d8c08d);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:26px;height:26px;font-size:11px}
.avatar.lg{width:56px;height:56px;font-size:20px}
.avatars{display:flex}
.avatars .avatar{border:2px solid var(--paper)}
.avatars .avatar + .avatar{margin-inline-start:-8px}

.empty{text-align:center;padding:30px 16px;color:var(--ink-3)}
.empty svg{width:34px;height:34px;color:var(--gold);opacity:.8}
.empty b{display:block;color:var(--ink);font-size:16px;margin:8px 0 4px}

.seg{display:inline-flex;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;height:32px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow-1);font-weight:600}
.seg svg{width:16px;height:16px}

.switch{position:relative;width:44px;height:26px;flex:none;border-radius:999px;border:0;background:var(--line);transition:background .15s}
.switch::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .15s}
.switch.on{background:var(--ok)}
.switch.on::after{inset-inline-start:21px}

.demo-bar{background:#5a4316;color:#fbefd2;font-size:12.5px;line-height:1.6;padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo-bar span{flex:1;min-width:200px}
.demo-bar button{border:1px solid rgba(251,239,210,.45);background:transparent;color:inherit;border-radius:999px;padding:3px 12px;font-size:12px}
.toast-wrap{position:fixed;top:calc(env(safe-area-inset-top) + var(--top-h) + 10px);inset-inline:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{pointer-events:auto;max-width:min(92vw,460px);display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:14px;background:var(--espresso);color:var(--cream);box-shadow:var(--shadow-2);border:1px solid rgba(231,203,134,.35);font-size:14px;animation:toastIn .25s ease}
.toast.bad{background:#5a221a;color:#fde9e4}
.toast svg{width:18px;height:18px;color:var(--gold-hi);flex:none}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ---------- النوافذ ---------- */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(18,17,16,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-height:94dvh;display:flex;flex-direction:column;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:var(--shadow-2);animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line-2)}
.sheet-head h2{flex:1;margin:0;font-size:17px;font-weight:700;min-width:0}
.sheet-body{padding:14px 16px;overflow-y:auto;overscroll-behavior:contain}
.sheet-foot{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);background:var(--paper-2);border-radius:0 0 0 0}
.sheet-foot .btn{flex:1}
.grabber{width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
@media (min-width:760px){
  .overlay{align-items:center;padding:24px}
  .sheet{max-width:640px;border-radius:20px;max-height:90dvh}
  .sheet.wide{max-width:920px}
  .sheet-foot{border-radius:0 0 20px 20px}
  .grabber{display:none}
}

/* ---------- المسار (العلامة المميزة) ---------- */
.track{--done:var(--gold);display:grid;grid-template-columns:repeat(6,1fr);position:relative;margin:6px 0 4px}
.track::before{content:'';position:absolute;top:13px;inset-inline:calc(100%/12);height:2px;background:var(--line)}
.track .fill{position:absolute;top:13px;inset-inline-start:calc(100%/12);height:2px;background:var(--gold-grad);transition:width .35s ease}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;padding:0;color:var(--ink-3);font-size:11.5px;font-weight:500}
.node i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:2px solid var(--line);font-style:normal;transition:all .2s}
.node i svg{width:14px;height:14px}
.node.done i{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-deep)}
.node.cur i{border-color:transparent;background:var(--gold-grad);color:var(--espresso);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 22%,transparent)}
.node.cur{color:var(--ink);font-weight:700}
.node .cnt{font-size:16px;font-weight:700;color:var(--ink);line-height:1}
.track.paused .fill{background:var(--ink-3)}
.track.lost .fill{background:var(--bad)}
.mini-track{display:inline-flex;gap:3px;align-items:center}
.mini-track b{width:14px;height:4px;border-radius:2px;background:var(--line)}
.mini-track b.on{background:var(--gold)}
.mini-track.lost b.on{background:var(--bad)}
.mini-track.paused b.on{background:var(--ink-3)}

/* ---------- الرئيسية ---------- */
.hello{padding:4px 2px 12px}
.hello .g{font-family:'Ruqaa',var(--font);font-weight:700;font-size:30px;line-height:1.35;color:var(--ink)}
.hello .d{color:var(--ink-3);font-size:13px}
.hello .sum{margin-top:6px;color:var(--ink-2);font-size:14px}
.hello .sum b{color:var(--ink)}
.funnel{padding:16px 10px 14px}
.funnel .track{margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.kpi{text-align:center}
.kpi b{display:block;font-size:20px;line-height:1.2}
.kpi span{font-size:12px;color:var(--ink-3)}
.money-card{background:var(--espresso);color:var(--cream);position:relative;overflow:hidden}
.money-card::after{content:'';position:absolute;inset-inline-end:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(231,203,134,.22),transparent 70%)}
.money-card .card-title{color:var(--cream)}
.money-card .big{font-size:28px;font-weight:700;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.3}
.money-card .muted{color:var(--cream-2)}

/* ---------- القوائم ---------- */
.list{background:var(--paper);border-radius:var(--r-l);box-shadow:var(--shadow-1);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-2);background:none;border-inline:0;border-top:0;width:100%;text-align:start;color:inherit}
.row:last-child{border-bottom:0}
button.row:hover,a.row:hover{background:var(--paper-2)}
.row .main-col{flex:1;min-width:0}
.row .t{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;line-height:1.35}
.row .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{display:flex;align-items:center;gap:10px;margin-top:5px;flex-wrap:wrap}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.due{font-size:12px;font-weight:600;color:var(--ink-3)}
.due.today{color:var(--warn)}
.due.late{color:var(--bad)}
.heat{font-size:15px;line-height:1}
.quick{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--wa);flex:none}
.quick svg{width:18px;height:18px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;top:50%;inset-inline-start:12px;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3)}
.search .input{padding-inline-start:38px;border-radius:999px}

/* لوحة المراحل */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.col{flex:none;width:262px;background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r-l);padding:10px;scroll-snap-align:start;min-height:200px}
.col.drop{border-color:var(--gold);background:var(--gold-soft)}
.col-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:2px 4px 10px}
.col-head .n{margin-inline-start:auto;color:var(--ink-3);font-weight:500;font-size:12px}
.kcard{display:block;width:100%;text-align:start;background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-m);padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow-1);cursor:grab;color:inherit}
.kcard b{display:block;font-size:14px}
.kcard .s{font-size:12px;color:var(--ink-3)}
.kcard.dragging{opacity:.45}

/* ---------- صفحة الشركة ---------- */
.co-head{display:flex;gap:12px;align-items:flex-start}
.co-head .back{margin-inline-start:-8px}
.co-title{flex:1;min-width:0}
.co-title h1{margin:0;font-size:23px;line-height:1.3;word-break:break-word}
.co-title .s{color:var(--ink-3);font-size:13px;margin-top:2px}
.stage-alt{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.follow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.follow .when{font-weight:700}
.info-list{display:grid;gap:2px}
.info{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line-2);min-height:42px}
.info:last-child{border-bottom:0}
.info svg{width:17px;height:17px;color:var(--ink-3);flex:none}
.info .k{color:var(--ink-3);font-size:13px;width:84px;flex:none}
.info .v{flex:1;min-width:0;word-break:break-word}
.info .v a{color:var(--ink)}
.cards-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.card-thumb{flex:none;width:132px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--paper-2);padding:0;position:relative}
.card-thumb img{width:100%;height:100%;object-fit:cover}
.card-add{flex:none;width:132px;height:84px;border-radius:10px;border:1.5px dashed var(--gold-line);background:var(--gold-soft);color:var(--gold-deep);display:grid;place-items:center;font-size:12px;font-weight:600}
.card-add svg{width:22px;height:22px;display:block;margin:0 auto 2px}

.views{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);color:var(--ink);font-size:13.5px}
.views svg{width:18px;height:18px;color:var(--gold-deep);flex:none}
.views.none{background:var(--paper-2);color:var(--ink-3)}

.timeline{position:relative;padding-inline-start:4px}
.ev{display:flex;gap:12px;padding:10px 0;position:relative}
.ev + .ev{border-top:1px solid var(--line-2)}
.ev .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--ink-3)) 14%,transparent);color:var(--c,var(--ink-3))}
.ev .ic svg{width:16px;height:16px}
.ev .body{flex:1;min-width:0}
.ev .h{font-size:13.5px;line-height:1.5}
.ev .h b{font-weight:600}
.ev .when{font-size:12px;color:var(--ink-3)}
.ev .txt{margin-top:6px;font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;background:var(--paper-2);border-radius:10px;padding:8px 10px;max-height:150px;overflow:hidden;position:relative}
.ev .txt.open{max-height:none}
.ev .more{font-size:12px;color:var(--gold-deep);background:none;border:0;padding:4px 0 0}
.log-types{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

/* ---------- الإرسال ---------- */
.tpl-pick{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.letter{min-height:260px;font-size:14.5px}
.send-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.send-grid .btn{min-height:48px}
.recipient{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.check{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;color:var(--ink-2);margin:10px 0 2px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--gold)}
.queue{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--paper-2);font-size:13px;margin-bottom:10px}
.queue .bar{flex:1;height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.queue .bar i{display:block;height:100%;background:var(--gold-grad)}
.ph-chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.ph{height:28px;padding:0 10px;border-radius:999px;border:1px dashed var(--gold-line);background:var(--gold-soft);color:var(--gold-deep);font-size:12px;font-weight:600}
.preview{white-space:pre-wrap;background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r-m);padding:14px;font-size:14px;line-height:1.85;max-height:420px;overflow:auto}

/* ---------- الزيارات ---------- */
.visit{display:flex;gap:14px;align-items:center}
.vdate{width:54px;flex:none;text-align:center;border-radius:12px;background:var(--espresso);color:var(--cream);padding:6px 0 7px;line-height:1.1}
.vdate b{display:block;font-size:22px;color:var(--gold-hi)}
.vdate span{font-size:11px}
.vprog{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.vprog i{display:block;height:100%;background:var(--gold-grad)}

/* ---------- الدخول والإعداد ---------- */
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 600px at 50% -10%,rgba(201,161,91,.28),transparent 60%),linear-gradient(180deg,rgba(18,17,16,.82),rgba(18,17,16,.96)),url(assets/brand/cover.webp) center/cover no-repeat,#121110;color:var(--cream)}
.gate-box{width:100%;max-width:420px}
.gate-brand{text-align:center;margin-bottom:20px}
.gate-brand img{width:132px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.gate-brand .w{font-family:'Yeseva',Georgia,serif;font-size:46px;line-height:1;margin-top:4px;background:linear-gradient(180deg,#f3dc9f 0%,#d2a85a 50%,#9a7330 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.gate-brand .s{font-size:13px;color:var(--cream-2);margin-top:6px}
.gate-brand .tg{font-family:'Ruqaa',var(--font);font-weight:700;font-size:24px;color:var(--gold-hi);margin-top:12px}
.gate-card{background:rgba(27,26,24,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(231,203,134,.18);border-radius:20px;padding:20px;color:var(--cream)}
.gate-card h2{margin:0 0 4px;font-size:18px}
.gate-card p{margin:0 0 14px;color:var(--cream-2);font-size:13.5px}
.gate-card .input{background:#121110;border-color:#3b362f;color:#f6efe0}
.gate-card .field > span{color:var(--cream-2)}
.gate-card .btn.gold{width:100%;min-height:48px;margin-top:6px}
.gate-card ol{margin:0;padding-inline-start:20px;color:var(--cream-2);font-size:13.5px;line-height:1.9}
.gate-card code{font-size:12px;background:#121110;border:1px solid #3b362f;border-radius:6px;padding:1px 6px;color:var(--gold-hi);direction:ltr;unicode-bidi:isolate}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.steps i{width:28px;height:4px;border-radius:4px;background:#3b362f}
.steps i.on{background:var(--gold)}

/* ---------- جدول ---------- */
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--ink-3);font-weight:500;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:end}
@media (max-width:560px){.tbl .opt{display:none}}

.lightbox{position:fixed;inset:0;z-index:90;background:rgba(10,9,8,.92);display:grid;place-items:center;padding:20px}
.lightbox img{max-width:100%;max-height:86dvh;border-radius:10px}
.lightbox .close{position:absolute;top:calc(env(safe-area-inset-top) + 10px);inset-inline-end:10px;color:#fff}

.boot{min-height:100dvh;display:grid;place-items:center;background:var(--espresso)}
.boot img{width:96px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1)}}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:120}
.section-label{font-size:13px;color:var(--ink-3);margin:18px 2px 8px;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.kv span{color:var(--ink-3)}
.divider{height:1px;background:var(--line-2);margin:12px 0}

/* ---------- البوابات والدخول ---------- */
.portal-switch{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(231,203,134,.22);flex:none}
.portal-switch button{border:0;background:none;color:var(--cream-2);height:30px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.portal-switch button svg{width:15px;height:15px}
.portal-switch button.on{background:var(--gold-grad);color:var(--espresso)}
.side .portal-switch{display:flex;margin:0 0 12px}
.side .portal-switch button{flex:1;justify-content:center;height:34px}
.brand-tag{font-size:11px;font-weight:700;color:var(--espresso);background:var(--gold-grad);border-radius:999px;padding:2px 8px;margin-inline-start:4px}
@media (max-width:430px){.topbar.has-switch .brand-name{display:none}}
@media (max-width:350px){.portal-switch button span{display:none}}
.secret{position:relative}
.secret .input{padding-inline-end:46px}
.secret .icon-btn{position:absolute;top:50%;inset-inline-end:3px;transform:translateY(-50%);color:var(--ink-3)}
.secret.dark .icon-btn{color:var(--cream-2)}
.acct{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;margin-bottom:8px;border-radius:14px;border:1px solid #3b362f;background:rgba(18,17,16,.55);color:var(--cream);text-align:start}
.acct img,.acct .ini{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none}
.acct .ini{display:grid;place-items:center;background:var(--gold-grad);color:var(--espresso);font-weight:700}
.acct .nm{flex:1;min-width:0}
.acct .nm b{display:block;font-size:15px}
.acct .nm small{color:var(--cream-2);font-size:12px}
.acct svg{color:var(--gold-hi);opacity:.7}
.acct.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(201,161,91,.25)}
.pin-form{margin-top:6px}
.portal-checks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.portal-checks .pc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--paper);cursor:pointer}
.portal-checks .pc input{width:18px;height:18px;accent-color:var(--gold)}
.portal-checks .pc svg{width:22px;height:22px;color:var(--gold-deep);flex:none}
.portal-checks .pc b{display:block;font-size:14px}
.portal-checks .pc small{font-size:11.5px;color:var(--ink-3)}
.portal-checks .pc.on{border-color:var(--gold);background:var(--gold-soft)}
.team-row .meta{gap:6px}
@media (max-width:620px){.team-row{flex-wrap:wrap}.team-row .end{width:100%;justify-content:flex-end;padding-inline-start:48px}}

/* ---------- العقارات ---------- */
.list.flat{box-shadow:none;border:1px solid var(--line-2)}
.chip-wrap{display:flex;gap:6px;flex-wrap:wrap}
.chip-wrap .chip{height:32px}
.chip-sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.form-sec{font-size:13px;font-weight:700;color:var(--gold-deep);margin:18px 0 10px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.form-sec:first-of-type{margin-top:2px}
fieldset.bare{border:0;padding:0;margin:0;min-width:0}
fieldset.bare:disabled{opacity:.62}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.row4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cat-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:76px;padding:10px 6px;border-radius:14px;border:1px solid var(--line);background:var(--paper);font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.3}
.cat-btn svg{width:26px;height:26px;color:var(--c)}
.cat-btn.on{border-color:var(--gold);background:var(--gold-soft);color:var(--ink);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 25%,transparent)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:4px;border:1px solid var(--line);border-radius:var(--r-m);padding:4px;background:var(--paper);min-height:44px}
.stepper button{width:34px;height:34px;border-radius:10px;border:0;background:var(--paper-2);display:grid;place-items:center;color:var(--ink)}
.stepper button svg{width:16px;height:16px}
.stepper b{flex:1;text-align:center;font-size:15px}
.props{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.pcard{background:var(--paper);border-radius:var(--r-l);box-shadow:var(--shadow-1);overflow:hidden;display:block;cursor:pointer;min-width:0;transition:transform .12s ease,box-shadow .12s ease}
.pcard:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(28,26,23,.12)}
.pcard .pimg{position:relative;aspect-ratio:16/9;background:var(--paper-2);overflow:hidden}
.pcard .pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .badges{position:absolute;top:8px;inset-inline-start:8px;display:flex;gap:6px;flex-wrap:wrap}
.pcard .badges .pill{background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pcard .badges .pill .dot{background:var(--c)}
.pill.on-photo{color:var(--ink);background:color-mix(in srgb,var(--paper) 90%,transparent)}
.pcard .count{position:absolute;bottom:8px;inset-inline-end:8px;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#fff;background:rgba(18,17,16,.55);border-radius:999px;padding:2px 8px}
.pcard .bd{padding:10px 12px 12px;min-width:0}
.pcard .price{font-weight:700;font-size:17px;line-height:1.3}
.pcard .price small{font-size:11px;font-weight:600;color:var(--ok)}
.pcard .ttl{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pcard .ttl .muted{font-weight:500}
.specs{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:6px}
.specs span{display:inline-flex;align-items:center;gap:4px}
.specs svg{width:14px;height:14px}
.cat-ill{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(140deg,color-mix(in srgb,var(--c) 22%,var(--paper)) 0%,color-mix(in srgb,var(--c) 7%,var(--paper)) 70%)}
.cat-ill svg{width:42%;max-width:64px;height:auto;aspect-ratio:1;color:var(--c);opacity:.85}
.pthumb{width:64px;height:48px;border-radius:10px;overflow:hidden;flex:none;background:var(--paper-2);border:0;padding:0;display:block}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb .cat-ill svg{width:26px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{border:0;background:var(--paper-2);border-radius:14px;padding:10px 4px 8px;text-align:center;color:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}

async function compressImage(file, maxSide = 1400, quality = 0.74) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * scale); const h = Math.round(img.naturalHeight * scale);
    const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    let q = quality; let data = canvas.toDataURL('image/jpeg', q);
    while (data.length > 900000 && q > 0.4) { q -= 0.1; data = canvas.toDataURL('image/jpeg', q); }
    return data;
  } finally { URL.revokeObjectURL(url); }
}

async function q(p) { const { data, error } = await p; if (error) throw error; return data; }
// جلب كل الصفوف على دفعات — Supabase يعيد 1000 صف كحد أقصى في الطلب الواحد
async function qAll(build, size = 1000) {
  const out = [];
  for (let from = 0; ; from += size) {
    const rows = await q(build().range(from, from + size - 1));
    out.push(...rows);
    if (rows.length !== size) return out;   // آخر دفعة
  }
}
// الروابط: http/https فقط (لا javascript: ولا غيره) — والنطاق بدون https:// يُكمَّل تلقائياً
// null = فارغ، undefined = رابط غير صالح
function cleanUrl(v) {
  const t = String(v ?? '').trim();
  if (!t) return null;
  const m = t.match(/https?:\/\/[^\s<>"'`]+/i);
  if (m) return m[0];
  if (/^[a-z][a-z0-9+.-]*:/i.test(t)) return undefined;
  if (/^[^\s/:@]+\.[a-z]{2,}(?:[/?#]\S*)?$/i.test(t)) return 'https://' + t;
  return undefined;
}
const safeHref = (v) => cleanUrl(v) || '';

async function setStage(company, stage, extra = {}) {
  if (company.stage === stage && !Object.keys(extra).length) return company;
  const patch = { stage, ...extra };
  if (stage === 'won' && !company.won_at) patch.won_at = todayISO();
  if (stage === 'won' || stage === 'lost') patch.next_followup = null;
  const row = await updateCompany(company.id, patch);
  if (stage === 'won') { confetti(); toast(`مبروك! تم توكيل المكتب من ${company.name} 🎉`); }
  return row;

async function afterSend(company, { channel, text, templateId, advance = true, phone, email }) {
  await logActivity({ company_id: company.id, type: channel, body: text, template_id: templateId || null });
  const patch = { last_contact_at: new Date().toISOString() };
  if (phone && !company.mobile && !company.phone) patch.mobile = String(phone).trim();
  if (email && !company.email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email).trim())) patch.email = String(email).trim().toLowerCase();

    if (['target', 'visited'].includes(company.stage)) patch.stage = 'contacted';

  return updateCompany(company.id, patch);
}

async function apiCall(path, body) {
  if (DEMO) return demoApi(path, body);
  const { data } = await sb.auth.getSession();
  const token = data?.session?.access_token;
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'content-type': 'application/json', ...(token ? { authorization: `Bearer ${token}` } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let j = {};
  try { j = await r.json(); } catch { j = { message: `HTTP ${r.status}` }; }
  if (!r.ok) throw new Error(j.message || j.error || `HTTP ${r.status}`);
  return j;
}

function confetti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'confetti';
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
  document.body.appendChild(c);
  const ctx = c.getContext('2d'); ctx.scale(devicePixelRatio, devicePixelRatio);
  const colors = ['#e7cb86', '#c9a15b', '#9a7330', '#f4ecd9', '#2e7d5b'];
  const parts = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2 + (Math.random() - 0.5) * 120, y: innerHeight * 0.35,
    vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 11 - 4, r: Math.random() * 6 + 3,
    c: colors[(Math.random() * colors.length) | 0], a: Math.random() * Math.PI, va: (Math.random() - 0.5) * 0.3,
  }));
  let frame = 0;
  (function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.vy += 0.32; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
    }
    if (++frame < 150) requestAnimationFrame(tick); else c.remove();
  })();
}

function parseRoute() {

}

}

function commissionTotals(s, companyId) {
  let collected = 0, share = 0, paid = 0;
  for (const p of s.payments) {
    if (companyId && p.company_id !== companyId) continue;
    collected += Number(p.amount) || 0;
    share += Number(p.commission_amount) || 0;
    if (p.commission_paid) paid += Number(p.commission_amount) || 0;
  }
  return { collected, share, paid, unpaid: share - paid };
}

function filterCompanies(s, { skipStage } = {}) {
  const f = s.filters; const t = todayISO();
  let list = s.companies;
  if (f.q) { const nq = norm(f.q); list = list.filter((c) => norm([c.name, c.contact_name, c.email, c.mobile, c.phone, c.sector, c.area, c.notes].join(' ')).includes(nq)); }
  if (f.due) list = list.filter((c) => OPEN.includes(c.stage) && c.next_followup && c.next_followup <= t);
  if (f.viewed) list = list.filter((c) => c.link_views > 0);
  if (f.hot) list = list.filter((c) => c.heat === 'hot');
  if (f.mine) list = list.filter((c) => !c.owner_id || c.owner_id === s.me?.id);
  if (!skipStage && f.stage !== 'all') list = list.filter((c) => c.stage === f.stage);
  const sorters = {
    followup: (a, b) => (a.next_followup || '9999').localeCompare(b.next_followup || '9999'),
    updated: (a, b) => String(b.updated_at).localeCompare(String(a.updated_at)),
    name: (a, b) => a.name.localeCompare(b.name, 'ar'),
  };
  return [...list].sort(sorters[f.sort] || sorters.followup);
}

function Board({ list }) {
  const [over, setOver] = useState(null);
  const [dragId, setDragId] = useState(null);
  const dragRef = useRef(null);
  const drop = async (stage, id) => {
    setOver(null);
    const c = list.find((x) => x.id === (id || dragRef.current || dragId)); setDragId(null); dragRef.current = null;
    if (!c || c.stage === stage) return;
    try { await setStage(c, stage); toast(`${c.name} ← ${STAGE[stage].label}`); } catch (e) { fail(e); }
  };
  return html`<div class="board">
    ${STAGES.map((st) => {
      const items = list.filter((c) => c.stage === st.k);
      return html`<div class=${'col' + (over === st.k ? ' drop' : '')} key=${st.k}
          onDragOver=${(e) => { e.preventDefault(); if (over !== st.k) setOver(st.k); }}
          onDragLeave=${(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setOver(null); }}
          onDrop=${(e) => { e.preventDefault(); let id = null; try { id = e.dataTransfer.getData('text/plain'); } catch { /* */ } drop(st.k, id); }}>
        <div class="col-head"><span class="dot" style=${`--c:${st.c}`}></span>${st.label}<span class="n num">${items.length}</span></div>
        ${items.map((c) => {
          const due = OPEN.includes(c.stage) ? dueInfo(c.next_followup) : null;
          return html`<button class=${'kcard' + (dragId === c.id ? ' dragging' : '')} key=${c.id} draggable="true"
              onDragStart=${(e) => { dragRef.current = c.id; setDragId(c.id); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', c.id); } catch { /* */ } }}
              onDragEnd=${() => { setDragId(null); setOver(null); }}
              onClick=${() => go('c/' + c.id)}>
            <b>${c.heat === 'hot' ? '🔥 ' : ''}${c.name}</b>
            <div class="s">${c.contact_name || c.email || ''}</div>
            ${due ? html`<div class=${'due ' + due.cls}>${due.label}</div>` : null}
          </button>`;
        })}
      </div>`;
    })}
  </div>`;
}

function CompanyPage({ id }) {
  const s = useS();
  const c = s.companies.find((x) => x.id === id);
  const [acts, setActs] = useState(null);
  const [events, setEvents] = useState([]);
  const [cards, setCards] = useState([]);
  const [cardsTick, setCardsTick] = useState(0);
  const [lb, setLb] = useState(null);
  const fileRef = useRef(null);

  useEffect(() => {
    if (!c) return undefined;
    let alive = true;
    Promise.all([
      q(sb.from('crm_activities').select('*').eq('company_id', id).order('happened_at', { ascending: false }).limit(300)),
      q(sb.from('crm_link_events').select('*').eq('company_id', id).order('created_at', { ascending: false }).limit(200)),
    ]).then(([a, e]) => { if (alive) { setActs(a); setEvents(e); } }).catch(fail);
    return () => { alive = false; };
  }, [id, s.tick]);
  useEffect(() => {
    if (!c) return undefined;
    let alive = true;
    q(sb.from('crm_card_images').select('*').eq('company_id', id).order('created_at')).then((im) => { if (alive) setCards(im); }).catch(fail);
    return () => { alive = false; };
  }, [id, cardsTick]);

  if (!c) {
    return html`<div class="page"><${PageHead} title="الشركة" back="companies" />
      <div class="card"><${Empty} icon="building" title=${s.companies.length ? 'الشركة غير موجودة' : 'جارٍ التحميل...'}>${s.companies.length ? 'ربما تم حذفها.' : ''}</${Empty}></div></div>`;
  }

  const owner = memberById(c.owner_id);
  const visit = s.visits.find((v) => v.id === c.visit_id);
  const due = OPEN.includes(c.stage) ? dueInfo(c.next_followup) : null;
  const link = companyLink(c);

  const pick = async (k) => {
    if (k === c.stage) return;
    if (k === 'lost') return openModal('lost', { id: c.id });
    try { await setStage(c, k); if (k !== 'won') toast(`تم النقل إلى «${STAGE[k].label}»`); } catch (e) { fail(e); }
  };
  const setFollow = async (iso) => { try { await updateCompany(c.id, { next_followup: iso }); toast(iso ? `المتابعة: ${fmtDate(iso)}` : 'أُلغي موعد المتابعة'); } catch (e) { fail(e); } };
  const cycleHeat = async () => { const order = ['warm', 'hot', 'cold']; const n = order[(order.indexOf(c.heat) + 1) % 3]; try { await updateCompany(c.id, { heat: n }); } catch (e) { fail(e); } };
  const addCard = async (e) => {
    const f = e.target.files?.[0]; e.target.value = '';
    if (!f) return;
    try {
      const data = await compressImage(f);
      await q(sb.from('crm_card_images').insert({ company_id: c.id, data }));
      setS((st) => ({ cardIdx: { ...st.cardIdx, [c.id]: (st.cardIdx[c.id] || 0) + 1 } }));
      setCardsTick((t) => t + 1); toast('تم حفظ صورة البطاقة');
    } catch (err) { fail(err); }
  };
  const delCard = async (img) => {
    if (!confirm('حذف صورة البطاقة؟')) return;
    try { await q(sb.from('crm_card_images').delete().eq('id', img.id)); setS((st) => ({ cardIdx: { ...st.cardIdx, [c.id]: Math.max(0, (st.cardIdx[c.id] || 1) - 1) } })); setCardsTick((t) => t + 1); } catch (err) { fail(err); }
  };
  const remove = async () => {
    if (!confirm(`حذف «${c.name}» نهائياً مع سجل المتابعة؟`)) return;
    try { await deleteCompany(c.id); toast('تم حذف الشركة'); go('companies'); } catch (e) { fail(e); }
  };
  const lastOpen = events.find((e) => e.event === 'open');

  return html`<div class="page">
    <div class="co-head">
      <button class="icon-btn back" aria-label="رجوع" onClick=${() => (history.length > 1 ? history.back() : go('companies'))}><${Icon} n="back" /></button>
      <div class="co-title">
        <h1>${c.name}</h1>
        <div class="s">${[c.sector, c.area, visit ? `زيارة ${fmtShort(visit.visit_date)}` : null].filter(Boolean).join(' · ') || SOURCES[c.source] || ''}</div>
      </div>
      <button class="icon-btn" title=${`الأهمية: ${HEAT[c.heat]?.label}`} aria-label="تغيير الأهمية" onClick=${cycleHeat} style="font-size:20px">${HEAT[c.heat]?.e}</button>
      <button class="icon-btn" aria-label="تعديل" onClick=${() => openModal('company', { id: c.id })}><${Icon} n="edit" /></button>
    </div>

    <div class="grid main-side" style="margin-top:12px">
      <div class="stack">
        <section class="card">
          <div class="card-title">المسار<span class="grow"></span><${StagePill} k=${c.stage} /></div>
          <${Track} stage=${c.stage} onPick=${pick} />

          ${c.stage === 'lost' && c.lost_reason ? html`<div class="hint" style="text-align:center;margin-top:8px">السبب: ${c.lost_reason}</div>` : null}
        </section>

        <section class="card">

          <div class="actions" style="margin-top:8px">
            <a class="btn" href=${waLink(c.mobile || c.phone, '')} target="_blank" rel="noopener" style=${c.mobile || c.phone ? '' : 'opacity:.5;pointer-events:none'}><${Icon} n="wa" /> محادثة</a>
            <a class="btn" href=${telHref(c.mobile || c.phone)} style=${c.mobile || c.phone ? '' : 'opacity:.5;pointer-events:none'}><${Icon} n="phone" /> اتصال</a>

            <a class="btn" href=${withPreview(link)} target="_blank" rel="noopener"><${Icon} n="eye" /> معاينة الصفحة</a>
          </div>
        </section>

        <section class="card">
          <div class="follow">
            <${Icon} n="calendar" />
            ${OPEN.includes(c.stage)
              ? html`<div style="flex:1;min-width:0">المتابعة القادمة: <span class="when">${c.next_followup ? fmtDate(c.next_followup) : 'غير محددة'}</span>${due ? html` <span class=${'due ' + due.cls}>(${due.label})</span>` : null}</div>`
              : html`<div style="flex:1">${c.stage === 'won' ? `تم التوكيل ${c.won_at ? 'في ' + fmtFull(c.won_at) : ''} ✅` : 'لا متابعة — الشركة غير مهتمة حالياً'}</div>`}
          </div>
          ${OPEN.includes(c.stage) ? html`<div class="chips" style="margin-top:10px">
            ${[['اليوم', 0], ['غداً', 1], ['بعد 3 أيام', 3], ['أسبوع', 7], ['أسبوعين', 14], ['شهر', 30]].map(([l, n]) => html`<button class="chip" onClick=${() => setFollow(addDays(todayISO(), n))}>${l}</button>`)}
            <label class="chip" style="position:relative"><${Icon} n="calendar" /> تاريخ<input type="date" value=${c.next_followup || ''} onChange=${(e) => e.target.value && setFollow(e.target.value)} style="position:absolute;inset:0;opacity:0;width:100%" aria-label="اختيار تاريخ المتابعة" /></label>
            ${c.next_followup ? html`<button class="chip" onClick=${() => setFollow(null)}><${Icon} n="x" /> إلغاء</button>` : null}
          </div>` : null}
          <div class=${'views' + (c.link_views ? '' : ' none')} style="margin-top:12px">
            <${Icon} n="eye" />
            ${c.link_views ? html`<span>فتحوا الرابط الخاص <b class="num">${c.link_views}</b> ${c.link_views === 1 ? 'مرة' : c.link_views === 2 ? 'مرتين' : 'مرات'} · آخر مرة ${ago(c.last_view_at || lastOpen?.created_at)}</span>`

            ${c.phone ? html`<div class="info"><${Icon} n="phone" /><span class="k">الهاتف</span><span class="v"><a class="num" href=${telHref(c.phone)}>${c.phone}</a></span></div>` : null}

            <button class="card-add" onClick=${() => fileRef.current?.click()}><span><${Icon} n="camera" />صورة بطاقة</span></button>

function LogForm({ c }) {
  const [type, setType] = useState('note');
  const [body, setBody] = useState('');
  const [outcome, setOutcome] = useState('');
  const [stage, setStageSel] = useState('');
  const [follow, setFollow] = useState('');
  const [when, setWhen] = useState(todayISO());
  const [busy, run] = useBusy();
  const save = () => run(async () => {
    if (!body.trim() && !stage && !follow && type === 'note') { toast('اكتب الملاحظة أولاً', 'bad'); return; }
    const happened = when === todayISO() ? new Date().toISOString() : new Date(when + 'T10:00:00').toISOString();
    await logActivity({ company_id: c.id, type, body: body.trim() || null, outcome: type === 'response' && outcome ? outcome : null, happened_at: happened });
    const patch = {};
    if (['call', 'meeting', 'response', 'whatsapp', 'email', 'visit'].includes(type)) patch.last_contact_at = happened;
    if (follow) patch.next_followup = addDays(todayISO(), Number(follow));
    if (stage && stage !== c.stage) {
      if (stage === 'won') await setStage(c, 'won', patch);
      else await updateCompany(c.id, { ...patch, stage, ...(stage === 'lost' ? { next_followup: null } : {}) });
    } else if (Object.keys(patch).length) await updateCompany(c.id, patch);
    setBody(''); setOutcome(''); setStageSel(''); setFollow(''); setWhen(todayISO());
    toast('تم التسجيل');
  });
  return html`<div style="margin-bottom:6px">
    <div class="log-types">${LOG_TYPES.map((t) => html`<button class=${'chip' + (type === t ? ' on' : '')} onClick=${() => setType(t)}><${Icon} n=${ACT[t].icon} /> ${ACT[t].label}</button>`)}</div>
    <textarea class="textarea" style="min-height:76px" placeholder=${type === 'response' ? 'ماذا كان ردّهم؟' : type === 'call' ? 'ملخص الاتصال...' : 'اكتب ملاحظة أو تفاصيل...'} value=${body} onInput=${(e) => setBody(e.target.value)}></textarea>
    ${type === 'response' ? html`<div class="chips" style="margin-top:8px">${Object.entries(OUTCOMES).map(([k, o]) => html`<button class=${'chip' + (outcome === k ? ' on' : '')} onClick=${() => setOutcome(outcome === k ? '' : k)}>${o.e} ${o.label}</button>`)}</div>` : null}
    <div class="row2" style="margin-top:8px">
      <select class="select" value=${stage} onChange=${(e) => setStageSel(e.target.value)} aria-label="تغيير المرحلة">
        <option value="">المرحلة كما هي</option>
        ${STAGES.map((st) => html`<option value=${st.k}>نقل إلى: ${st.label}</option>`)}
      </select>
      <select class="select" value=${follow} onChange=${(e) => setFollow(e.target.value)} aria-label="موعد المتابعة">
        <option value="">موعد المتابعة كما هو</option>
        <option value="1">متابعة غداً</option><option value="3">بعد 3 أيام</option><option value="7">بعد أسبوع</option><option value="14">بعد أسبوعين</option><option value="30">بعد شهر</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
      <input class="input" type="date" value=${when} max=${todayISO()} onChange=${(e) => setWhen(e.target.value || todayISO())} style="width:auto;flex:1" aria-label="تاريخ النشاط" />
      <button class="btn primary" onClick=${save} disabled=${busy}>${busy ? html`<${Spinner} />` : html`<${Icon} n="check" />`} تسجيل</button>
    </div>
  </div>`;
}

function Timeline({ acts, events }) {
  const [open, setOpen] = useState({});
  if (acts === null) return html`<div class="muted small" style="padding:10px 0"><${Spinner} /> جارٍ التحميل...</div>`;
  const items = [
    ...acts.map((a) => ({ kind: 'act', at: a.happened_at || a.created_at, a })),
    ...events.map((e) => ({ kind: 'ev', at: e.created_at, e })),
  ].sort((x, y) => String(y.at).localeCompare(String(x.at)));
  if (!items.length) return html`<div class="muted small" style="padding:10px 0">لا يوجد سجل بعد — سجّل أول نشاط من الأعلى.</div>`;
  return html`<div class="timeline" style="margin-top:6px">${items.map((it) => {
    if (it.kind === 'ev') {
      const ev = EVENTS[it.e.event] || { label: it.e.event, icon: 'eye' };
      return html`<div class="ev" key=${'e' + it.e.id} style="--c:#b8873b"><span class="ic"><${Icon} n=${ev.icon} /></span>
        <div class="body"><div class="h"><b>${ev.label}</b></div><div class="when">${ago(it.at)} · ${fmtTime(it.at)}</div></div></div>`;
    }
    const a = it.a; const k = ACT[a.type] || ACT.note; const m = memberById(a.created_by);
    const long = (a.body || '').length > 220;
    return html`<div class="ev" key=${a.id} style=${`--c:${k.c}`}><span class="ic"><${Icon} n=${k.icon} /></span>
      <div class="body">
        <div class="h"><b>${actLine(a)}</b>${a.type === 'response' && a.outcome ? ` ${OUTCOMES[a.outcome].e}` : ''}</div>
        <div class="when">${m ? firstName(m.full_name) + ' · ' : ''}${ago(it.at)}${new Date(it.at).getHours() ? ' · ' + fmtTime(it.at) : ''}</div>
        ${a.body ? html`<div class=${'txt' + (open[a.id] || !long ? ' open' : '')}>${a.body}</div>${long ? html`<button class="more" onClick=${() => setOpen({ ...open, [a.id]: !open[a.id] })}>${open[a.id] ? 'إخفاء' : 'عرض النص كاملاً'}</button>` : null}` : null}
      </div></div>`;
  })}</div>`;
}

function RetainedCard({ c }) {
  const s = useS();
  const admin = isAdmin();
  const pays = s.payments.filter((p) => p.company_id === c.id);
  const t = commissionTotals(s, c.id);
  const p = partner();
  const [form, setForm] = useState({ amount: '', paid_on: todayISO(), description: '' });
  const [busy, run] = useBusy();
  const saveContract = (patch) => run(async () => { await updateCompany(c.id, patch); toast('تم الحفظ'); });
  const add = () => run(async () => {
    const amount = toNum(form.amount);
    if (!(amount > 0)) { toast('أدخل مبلغاً صحيحاً', 'bad'); return; }
    const row = await q(sb.from('crm_payments').insert({ company_id: c.id, amount, paid_on: form.paid_on || todayISO(), description: form.description || null, commission_rate: c.commission_rate ?? s.settings?.commission_rate ?? 30 }).select().single());
    setS((st) => ({ payments: [row, ...st.payments], tick: st.tick + 1 }));
    setForm({ amount: '', paid_on: todayISO(), description: '' });
    toast('تم تسجيل الدفعة');
  });
  const togglePaid = (pay) => run(async () => {
    const row = await q(sb.from('crm_payments').update({ commission_paid: !pay.commission_paid, commission_paid_on: !pay.commission_paid ? todayISO() : null }).eq('id', pay.id).select().single());
    setS((st) => ({ payments: st.payments.map((x) => (x.id === pay.id ? row : x)) }));
  });
  const del = (pay) => { if (!confirm('حذف هذه الدفعة؟')) return; run(async () => { await q(sb.from('crm_payments').delete().eq('id', pay.id)); setS((st) => ({ payments: st.payments.filter((x) => x.id !== pay.id) })); }); };
  return html`<section class="card">
    <div class="card-title"><${Icon} n="trophy" /> التوكيل والأتعاب</div>
    <div class="row2">
      <${Field} label="نوع الاتفاق"><select class="select" value=${c.contract_type || ''} onChange=${(e) => saveContract({ contract_type: e.target.value || null })}>
        <option value="">—</option>${CONTRACT_TYPES.map((x) => html`<option>${x}</option>`)}</select></${Field}>
      <${Field} label="قيمة الاتفاق (د.ب)"><input class="input num" inputmode="decimal" value=${c.contract_value ?? ''} onChange=${(e) => { const n = toNum(e.target.value); saveContract({ contract_value: e.target.value === '' || Number.isNaN(n) ? null : n }); }} /></${Field}>
    </div>
    ${admin ? html`<${Field} label=${`نسبة ${p ? firstName(p.full_name) : 'الشريك'} من هذه الشركة (%)`}><input class="input num" type="number" min="0" max="100" step="0.5" value=${c.commission_rate} onChange=${(e) => saveContract({ commission_rate: toNum(e.target.value) || 0 })} /></${Field}>` : null}
    <div class="kv"><span>المحصّل</span><b class="num">${money(t.collected)} د.ب</b></div>
    <div class="kv"><span>نصيب ${p ? firstName(p.full_name) : 'الشريك'}</span><b class="num">${money(t.share)} د.ب</b></div>
    <div class="kv"><span>المتبقي للصرف</span><b class="num">${money(t.unpaid)} د.ب</b></div>
    ${pays.length ? html`<div class="divider"></div>${pays.map((pay) => html`<div class="kv" key=${pay.id} style="align-items:center">
        <span style="flex:1"><span class="num">${fmtShort(pay.paid_on)}</span> · <b class="num" style="color:var(--ink)">${money(pay.amount)}</b>${pay.description ? ` · ${pay.description}` : ''}<br /><span class="small">العمولة <span class="num">${money(pay.commission_amount)}</span> — ${pay.commission_paid ? `صُرفت ${pay.commission_paid_on ? fmtShort(pay.commission_paid_on) : ''}` : 'لم تُصرف'}</span></span>
        ${admin ? html`<button class=${'switch' + (pay.commission_paid ? ' on' : '')} title="تم صرف العمولة" aria-label="تم صرف العمولة" onClick=${() => togglePaid(pay)}></button><button class="icon-btn" aria-label="حذف" onClick=${() => del(pay)}><${Icon} n="trash" size=${16} /></button>` : null}
      </div>`)}` : null}
    ${admin ? html`<div class="divider"></div>
      <div class="row2"><input class="input num" inputmode="decimal" placeholder="المبلغ المحصّل" value=${form.amount} onInput=${(e) => setForm({ ...form, amount: e.target.value })} />
      <input class="input" type="date" value=${form.paid_on} onInput=${(e) => setForm({ ...form, paid_on: e.target.value })} /></div>
      <input class="input" style="margin-top:8px" placeholder="وصف (اختياري): دفعة أولى، أتعاب شهر..." value=${form.description} onInput=${(e) => setForm({ ...form, description: e.target.value })} />
      <button class="btn primary block" style="margin-top:8px" onClick=${add} disabled=${busy}><${Icon} n="plus" /> تسجيل دفعة</button>`
      : html`<div class="hint">تسجيل الدفعات وصرف العمولة يتم من بوابة المدير.</div>`}
  </section>`;
}

/* =====================================================================
   14) نموذج الشركة (إضافة سريعة في الميدان + تعديل كامل)
   ===================================================================== */
const EMPTY_CO = { name: '', contact_name: '', contact_title: '', mobile: '', phone: '', email: '', sector: '', area: '', website: '', instagram: '', address: '', maps_url: '', other_contacts: '', notes: '', source: 'visit', heat: 'warm', owner_id: '', visit_id: '', stage: '' };

function lastVisitToday() {
  const t = todayISO();
  return S().visits.find((v) => v.visit_date === t) || null;
}

function CompanyForm({ id, visitId, onClose }) {
  const s = useS();
  const existing = id ? s.companies.find((c) => c.id === id) : null;
  const todayVisit = lastVisitToday();
  const initVisit = existing ? existing.visit_id || '' : visitId || todayVisit?.id || '';
  const initArea = existing ? existing.area || '' : (s.visits.find((v) => v.id === initVisit)?.area || '');
  const [f, setF] = useState(() => (existing
    ? { ...EMPTY_CO, ...Object.fromEntries(Object.entries(existing).map(([k, v]) => [k, v ?? ''])) }
    : { ...EMPTY_CO, visit_id: initVisit, area: initArea, owner_id: s.me?.id || '' }));
  const [more, setMore] = useState(Boolean(existing));
  const [photo, setPhoto] = useState(null);
  const [busy, run] = useBusy();
  const [err, setErr] = useState('');
  const fileRef = useRef(null);
  const nameRef = useRef(null);
  useEffect(() => { if (!existing) setTimeout(() => nameRef.current?.focus(), 250); }, []);
  const set = (k) => (e) => setF((x) => ({ ...x, [k]: e.target.value }));
  const dup = useMemo(() => {
    const nm = norm(f.name); const em = f.email.trim().toLowerCase(); const mob = waNumber(f.mobile);
    if (nm.length < 3 && !em && !mob) return null;
    return s.companies.find((c) => c.id !== existing?.id && ((nm.length >= 3 && norm(c.name) === nm) || (em && (c.email || '').toLowerCase() === em) || (mob && waNumber(c.mobile) === mob))) || null;
  }, [f.name, f.email, f.mobile]);

  const takePhoto = async (e) => {
    const file = e.target.files?.[0]; e.target.value = '';
    if (!file) return;
    try { setPhoto(await compressImage(file)); } catch (er) { fail(er); }
  };

  const save = (again) => run(async () => {
    setErr('');
    if (!f.name.trim()) { setErr('اسم الشركة مطلوب'); nameRef.current?.focus(); return; }
    if (f.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) { setErr('البريد الإلكتروني غير صحيح'); return; }
    let visit_id = f.visit_id || null;
    if (visit_id === '__new') {
      const v = await saveVisit({ visit_date: todayISO(), area: f.area || null, title: f.area ? `جولة ${f.area}` : null, attendees: s.team.filter((t) => t.active).map((t) => t.id), status: 'done' });
      visit_id = v.id;
    }
    const clean = (v) => (typeof v === 'string' ? v.trim() || null : v);
    const data = {
      name: f.name.trim(), contact_name: clean(f.contact_name), contact_title: clean(f.contact_title), mobile: clean(f.mobile), phone: clean(f.phone),
      email: clean(f.email)?.toLowerCase() || null, sector: clean(f.sector), area: clean(f.area), website: clean(f.website), instagram: clean(f.instagram),
      address: clean(f.address), maps_url: clean(f.maps_url), other_contacts: clean(f.other_contacts), notes: clean(f.notes),
      source: f.source || 'visit', heat: f.heat || 'warm', owner_id: f.owner_id || null, visit_id,
    };
    let row;
    if (existing) {
      row = await updateCompany(existing.id, data);
    } else {
      data.stage = f.stage || (visit_id ? 'visited' : 'target');
      if (data.stage !== 'target') data.next_followup = todayISO();
      row = await createCompany(data);
      if (visit_id) {
        const v = S().visits.find((x) => x.id === visit_id);
        await logActivity({ company_id: row.id, type: 'visit', body: `زيارة ميدانية${v?.area ? ` — ${v.area}` : ''}`, happened_at: v && v.visit_date !== todayISO() ? new Date(v.visit_date + 'T10:00:00').toISOString() : new Date().toISOString() });
      }
    }
    if (photo) {
      await q(sb.from('crm_card_images').insert({ company_id: row.id, data: photo }));
      setS((st) => ({ cardIdx: { ...st.cardIdx, [row.id]: (st.cardIdx[row.id] || 0) + 1 } }));
    }
    toast(existing ? 'تم حفظ التعديلات' : `أُضيفت «${row.name}»`);
    if (again) {
      setF((x) => ({ ...EMPTY_CO, visit_id: visit_id || '', area: x.area, owner_id: x.owner_id, source: x.source }));
      setPhoto(null); setTimeout(() => nameRef.current?.focus(), 50);
    } else {
      onClose();
      if (!existing) go('c/' + row.id);
    }
  });

  const foot = html`
    ${existing ? null : html`<button class="btn" onClick=${() => save(true)} disabled=${busy}>حفظ وإضافة أخرى</button>`}
    <button class="btn primary" onClick=${() => save(false)} disabled=${busy}>${busy ? html`<${Spinner} />` : html`<${Icon} n="check" />`} ${existing ? 'حفظ' : 'حفظ الشركة'}</button>`;

  return html`<${Sheet} title=${existing ? `تعديل: ${existing.name}` : 'إضافة شركة'} onClose=${onClose} foot=${foot}>
    ${existing ? null : html`<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
      ${photo ? html`<button class="card-thumb" onClick=${() => fileRef.current?.click()} title="تغيير الصورة"><img src=${photo} alt="بطاقة العمل" /></button>`
        : html`<button class="card-add" onClick=${() => fileRef.current?.click()}><span><${Icon} n="camera" />صوّر البطاقة</span></button>`}
      <div class="hint" style="flex:1;margin:0">صوّر بطاقة العمل (Business Card) لتُحفظ مع الشركة، ثم اكتب الاسم والرقم فقط — الباقي لاحقاً.</div>
      <input ref=${fileRef} type="file" accept="image/*" capture="environment" class="hide" onChange=${takePhoto} />
    </div>`}
    <${Field} label="اسم الشركة *"><input ref=${nameRef} class="input" value=${f.name} onInput=${set('name')} placeholder="مثال: شركة الخليج للمقاولات" autocomplete="organization" /></${Field}>
    ${dup ? html`<div class="hint" style="color:var(--warn);margin:-6px 0 10px">⚠️ توجد شركة مشابهة مسجّلة: <a href=${'#/c/' + dup.id} onClick=${onClose}><b>${dup.name}</b></a> (${STAGE[dup.stage]?.label})</div>` : null}
    <div class="row2">
      <${Field} label="الشخص المسؤول"><input class="input" value=${f.contact_name} onInput=${set('contact_name')} placeholder="الاسم" /></${Field}>
      <${Field} label="المنصب"><input class="input" value=${f.contact_title} onInput=${set('contact_title')} placeholder="مثال: المدير العام" /></${Field}>
    </div>
    <div class="row2">
      <${Field} label="الجوال (واتساب)"><input class="input num" type="tel" inputmode="tel" value=${f.mobile} onInput=${set('mobile')} placeholder="3xxxxxxx" /></${Field}>
      <${Field} label="البريد الإلكتروني"><input class="input ltr" type="email" inputmode="email" value=${f.email} onInput=${set('email')} placeholder="name@company.com" /></${Field}>
    </div>
    <div class="row2">
      <${Field} label="الزيارة"><select class="select" value=${f.visit_id} onChange=${(e) => { const v = s.visits.find((x) => x.id === e.target.value); setF((x) => ({ ...x, visit_id: e.target.value, area: v?.area || x.area })); }}>
        <option value="">بدون زيارة</option>
        ${todayVisit ? null : html`<option value="__new">＋ زيارة اليوم (جديدة)</option>`}
        ${s.visits.slice(0, 30).map((v) => html`<option value=${v.id}>${fmtShort(v.visit_date)}${v.area ? ` — ${v.area}` : v.title ? ` — ${v.title}` : ''}</option>`)}
      </select></${Field}>
      <${Field} label="المنطقة"><input class="input" list="areas" value=${f.area} onInput=${set('area')} placeholder="السيف، المنامة..." /></${Field}>
    </div>
    <datalist id="areas">${AREAS.map((a) => html`<option value=${a} />`)}</datalist>
    <datalist id="sectors">${SECTORS.map((a) => html`<option value=${a} />`)}</datalist>
    ${more ? html`
      <div class="row2">
        <${Field} label="القطاع"><input class="input" list="sectors" value=${f.sector} onInput=${set('sector')} /></${Field}>
        <${Field} label="هاتف المكتب"><input class="input num" type="tel" value=${f.phone} onInput=${set('phone')} /></${Field}>
      </div>
      <div class="row2">
        <${Field} label="يتابعها"><select class="select" value=${f.owner_id} onChange=${set('owner_id')}><option value="">الفريق (مشتركة)</option>${s.team.filter((t) => t.active).map((t) => html`<option value=${t.id}>${t.full_name}</option>`)}</select></${Field}>
        <${Field} label="الأهمية"><select class="select" value=${f.heat} onChange=${set('heat')}>${Object.entries(HEAT).map(([k, h]) => html`<option value=${k}>${h.e} ${h.label}</option>`)}</select></${Field}>
      </div>
      <div class="row2">
        <${Field} label="المصدر"><select class="select" value=${f.source} onChange=${set('source')}>${Object.entries(SOURCES).map(([k, v]) => html`<option value=${k}>${v}</option>`)}</select></${Field}>
        ${existing ? html`<span></span>` : html`<${Field} label="المرحلة"><select class="select" value=${f.stage} onChange=${set('stage')}><option value="">تلقائي (${f.visit_id ? 'تمت الزيارة' : 'مستهدفة'})</option>${STAGES.map((st) => html`<option value=${st.k}>${st.label}</option>`)}</select></${Field}>`}
      </div>
      <div class="row2">
        <${Field} label="الموقع الإلكتروني"><input class="input ltr" value=${f.website} onInput=${set('website')} placeholder="company.com" /></${Field}>
        <${Field} label="انستغرام"><input class="input ltr" value=${f.instagram} onInput=${set('instagram')} placeholder="@company" /></${Field}>
      </div>
      <${Field} label="العنوان"><input class="input" value=${f.address} onInput=${set('address')} placeholder="البرج، الطابق، المكتب" /></${Field}>
      <${Field} label="رابط الموقع على الخريطة"><input class="input ltr" value=${f.maps_url} onInput=${set('maps_url')} placeholder="https://maps.google.com/..." /></${Field}>
      <${Field} label="جهات اتصال أخرى"><textarea class="textarea" style="min-height:70px" value=${f.other_contacts} onInput=${set('other_contacts')} placeholder="اسم — منصب — رقم"></textarea></${Field}>
      <${Field} label="ملاحظات"><textarea class="textarea" style="min-height:80px" value=${f.notes} onInput=${set('notes')}></textarea></${Field}>
    ` : html`<button class="btn ghost block" onClick=${() => setMore(true)}><${Icon} n="down" /> حقول إضافية (القطاع، الهاتف، الملاحظات...)</button>`}
    ${err ? html`<div class="err">${err}</div>` : null}
  </${Sheet}>`;
}

function LostSheet({ id, onClose }) {
  const c = S().companies.find((x) => x.id === id);
  const [reason, setReason] = useState('');
  const [other, setOther] = useState('');
  const [busy, run] = useBusy();
  if (!c) return null;
  const save = () => run(async () => {
    const r = reason === 'أخرى' ? other.trim() || 'أخرى' : reason || null;
    await setStage(c, 'lost', { lost_reason: r });
    if (r) await logActivity({ company_id: c.id, type: 'note', body: `سبب عدم الاهتمام: ${r}` });
    toast('تم التحديث'); onClose();
  });
  return html`<${Sheet} title=${`«${c.name}» غير مهتمة`} onClose=${onClose} foot=${html`<button class="btn" onClick=${onClose}>إلغاء</button><button class="btn primary" onClick=${save} disabled=${busy}>تأكيد</button>`}>
    <p class="muted" style="margin-top:0">ما السبب؟ (يساعدكم لاحقاً في تحسين العرض)</p>
    <div class="chips" style="flex-wrap:wrap">${LOST_REASONS.map((r) => html`<button class=${'chip' + (reason === r ? ' on' : '')} onClick=${() => setReason(r)}>${r}</button>`)}</div>
    ${reason === 'أخرى' ? html`<input class="input" style="margin-top:10px" placeholder="اكتب السبب" value=${other} onInput=${(e) => setOther(e.target.value)} />` : null}
  </${Sheet}>`;
}

/* =====================================================================
   15) إرسال الخطاب — واتساب / بريد / مشاركة البروفايل
   ===================================================================== */
let pdfCache = null;
async function getProfileFile() {
  if (pdfCache) return pdfCache;
  const u = S().settings?.profile_url || 'assets/altayeb-profile.pdf';
  const r = await fetch(/^https?:\/\//.test(u) ? u : u.replace(/^\//, ''));
  if (!r.ok) throw new Error('تعذّر تحميل ملف البروفايل');
  const blob = await r.blob();
  pdfCache = new File([blob], 'Al-Tayeb-Law-Firm-Profile.pdf', { type: 'application/pdf' });
  return pdfCache;
}

function SendSheet({ ids, onClose }) {
  const s = useS();
  const queue = ids.map((i) => s.companies.find((c) => c.id === i)).filter(Boolean);
  const [idx, setIdx] = useState(0);
  const [done, setDone] = useState({});
  const c = queue[idx];
  const [tplId, setTplId] = useState(() => pickTemplate(queue[0])?.id || '');
  const tpl = s.templates.find((t) => t.id === tplId) || null;
  const [text, setText] = useState('');
  const [subject, setSubject] = useState('');
  const [phone, setPhone] = useState('');
  const [email, setEmail] = useState('');
  const [advance, setAdvance] = useState(true);
  const [viaSystem, setViaSystem] = useState(true);
  const [busy, run] = useBusy();
  const canShareFiles = typeof navigator.canShare === 'function' && isMobile();

  useEffect(() => { if (canShareFiles) getProfileFile().catch(() => {}); }, []);
  useEffect(() => {
    if (!c) return;
    setText(tpl ? fillTemplate(tpl.body, c) : fillTemplate('{رابط_الملف}', c));
    setSubject(tpl?.subject ? fillTemplate(tpl.subject, c) : `مكتب الطيب للمحاماة والاستشارات القانونية — ${c.name}`);
    setPhone(c.mobile || c.phone || '');
    setEmail(c.email || '');
  }, [idx, tplId]);

  if (!c) return html`<${Sheet} title="إرسال خطاب" onClose=${onClose}><${Empty} icon="check" title="لا توجد شركات للإرسال" /></${Sheet}>`;

  const nextOrClose = () => {
    if (idx < queue.length - 1) setIdx(idx + 1);
    else { if (queue.length > 1) toast('انتهى الإرسال المتتابع 👏'); onClose(); }
  };
  const record = (channel) => run(async () => {
    await afterSend(c, { channel, text: channel === 'email' ? `${subject}\n\n${stripWa(text)}` : text, templateId: tpl?.id, advance, phone, email });
    setDone((d) => ({ ...d, [c.id]: true }));
    toast(channel === 'whatsapp' ? 'سُجّل الإرسال عبر واتساب' : 'سُجّل الإرسال بالبريد');
    nextOrClose();
  });
  const sendWa = () => {
    window.open(waLink(phone, text), '_blank', 'noopener');
    record('whatsapp');
  };
  const sendMail = () => {
    if (!email.trim()) { toast('أضف البريد الإلكتروني للشركة أولاً', 'bad'); return; }
    if (s.smtp && viaSystem) {
      run(async () => {
        const r = await apiCall('/api/send-email', { to: email.trim(), subject, text, attachProfile: true, ccMe: false });
        await afterSend(c, { channel: 'email', text: `${subject}\n\n${stripWa(text)}`, templateId: tpl?.id, advance, phone, email });
        setDone((d) => ({ ...d, [c.id]: true }));
        toast(r.attached ? 'أُرسل البريد مع البروفايل PDF ✓' : 'أُرسل البريد ✓');
        nextOrClose();
      });
      return;
    }
    const body = stripWa(text);
    if (isMobile()) location.href = mailtoLink(email.trim(), subject, body);
    else window.open(gmailLink(email.trim(), subject, body), '_blank', 'noopener');
    record('email');
  };
  const shareFile = async () => {
    try {
      const file = await getProfileFile();
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Al-Tayeb Law Firm — Company Profile' });
      } else {
        downloadFile(file.name, file);
        toast('تم تنزيل البروفايل — أرفقه في المحادثة');
      }
    } catch (e) { if (e?.name !== 'AbortError') fail(e); }
  };
  const channel = tpl?.channel || 'both';
  const foot = html`
    ${queue.length > 1 ? html`<button class="btn" style="flex:0 0 auto" onClick=${nextOrClose}>تخطي</button>` : null}
    ${channel !== 'email' ? html`<button class="btn wa" onClick=${sendWa} disabled=${busy}><${Icon} n="wa" /> واتساب</button>` : null}
    ${channel !== 'whatsapp' ? html`<button class="btn primary" onClick=${sendMail} disabled=${busy}>${busy ? html`<${Spinner} />` : html`<${Icon} n="mail" />`} بريد</button>` : null}`;

  return html`<${Sheet} title=${queue.length > 1 ? `إرسال متتابع — ${c.name}` : `إرسال خطاب — ${c.name}`} onClose=${onClose} foot=${foot}>
    ${queue.length > 1 ? html`<div class="queue"><${Icon} n="queue" /> <span class="num">${idx + 1} / ${queue.length}</span><span class="bar"><i style=${`width:${((idx + (done[c.id] ? 1 : 0)) / queue.length) * 100}%`}></i></span></div>` : null}
    <div class="tpl-pick chips">${s.templates.map((t) => html`<button class=${'chip' + (t.id === tplId ? ' on' : '')} onClick=${() => setTplId(t.id)}>${t.name}</button>`)}</div>
    <div class="recipient">
      <${Field} label="الجوال (واتساب)"><input class="input num" type="tel" value=${phone} onInput=${(e) => setPhone(e.target.value)} placeholder="بدون رقم: اختر من واتساب" /></${Field}>
      <${Field} label="البريد"><input class="input ltr" type="email" value=${email} onInput=${(e) => setEmail(e.target.value)} placeholder="name@company.com" /></${Field}>
    </div>
    ${channel !== 'whatsapp' ? html`<${Field} label="موضوع البريد"><input class="input" value=${subject} onInput=${(e) => setSubject(e.target.value)} /></${Field}>` : null}
    <${Field} label="نص الخطاب (يمكنك تعديله قبل الإرسال)" hint="الرابط داخل الخطاب خاص بهذه الشركة: يفتح البروفايل والفريق والخدمات، ويخبرك متى فتحوه.">
      <textarea class="textarea letter" value=${text} onInput=${(e) => setText(e.target.value)}></textarea>
    </${Field}>
    <label class="check"><input type="checkbox" checked=${advance} onChange=${(e) => setAdvance(e.target.checked)} />
      <span>بعد الإرسال: ${['target', 'visited'].includes(c.stage) ? 'انقلها إلى «تم التواصل» و' : ''}حدّد متابعة بعد ${daysText(Number(s.settings?.followup_days || 3))}</span></label>
    ${s.smtp ? html`<label class="check"><input type="checkbox" checked=${viaSystem} onChange=${(e) => setViaSystem(e.target.checked)} /><span>أرسل البريد مباشرة من النظام مع إرفاق البروفايل PDF</span></label>` : null}
    <div class="send-grid" style="margin-top:14px">
      <button class="btn" onClick=${async () => { (await copyText(text)) ? toast('تم نسخ النص') : toast('تعذّر النسخ', 'bad'); }}><${Icon} n="copy" /> نسخ النص</button>
      ${canShareFiles ? html`<button class="btn" onClick=${shareFile}><${Icon} n="share" /> مشاركة PDF</button>`
        : html`<a class="btn" href=${profileUrl()} download="Al-Tayeb-Law-Firm-Profile.pdf" target="_blank" rel="noopener"><${Icon} n="download" /> تنزيل PDF</a>`}
    </div>
    <div class="hint">${canShareFiles ? '«مشاركة PDF» يرسل ملف البروفايل نفسه — اختر واتساب ثم محادثة الشركة.' : 'لإرفاق ملف البروفايل في واتساب ويب: نزّله ثم اسحبه إلى المحادثة.'}</div>
    ${!phone ? html`<div class="hint">لا يوجد رقم جوال — سيفتح واتساب لتختار جهة الاتصال بنفسك.</div>` : null}
  </${Sheet}>`;
}
