        </section>
        ${admin ? html`<section class="card">
          <div class="card-title"><${Icon} n="users" /> الفريق والبوابات<span class="grow"></span><button class="btn sm gold" onClick=${() => openModal('member', {})}><${Icon} n="plus" /> عضو</button></div>
          ${s.team.map((m) => html`<div class="row team-row" style="padding:10px 0" key=${m.id}>
            <${Avatar} m=${m} />
            <div class="main-col"><div class="t"><span>${m.full_name}</span>${s.settings?.partner_id === m.id ? html`<span class="pill" style="--c:#b8873b">عمولة ${Number(s.settings?.commission_rate ?? 30)}%</span>` : null}</div>
              <div class="s ltr" style="text-align:right">${m.email}</div>
              <div class="meta">${m.role === 'admin' ? html`<span class="pill" style="--c:#8a6424">المدير · كل البوابات</span>`
                : html`${(m.portals || []).includes('companies') ? html`<span class="pill" style="--c:#4f6d8a"><${Icon} n="building" size=${12} /> الشركات</span>` : null}${(m.portals || []).includes('realestate') ? html`<span class="pill" style="--c:#2e7d5b"><${Icon} n="villa" size=${12} /> العقارات</span>` : null}<span class="small muted">${m.role === 'partner' ? 'شريك' : 'عضو'}</span>`}${m.active ? '' : html`<span class="pill" style="--c:#a8432f">معطّل</span>`}</div></div>
            <div class="end" style="flex-direction:row;align-items:center">

              ${m.id !== me.id ? html`<button class=${'switch' + (m.active ? ' on' : '')} aria-label="تفعيل الحساب" onClick=${() => setActive(m)}></button>` : null}
            </div>

        <section class="card">
          <button class="btn danger block" onClick=${logout}><${Icon} n="logout" /> تسجيل الخروج</button>
        </section>
      </div>
      ${admin ? html`<div class="stack">
        <${ReSettingsCard} />
        <section class="card">
          <div class="card-title"><${Icon} n="building" /> بيانات المكتب (تظهر في صفحة الشركات والبريد)</div>
          <${Field} label="اسم المكتب"><input class="input" ...${ff('firm_name_ar')} /></${Field}>
          <${Field} label="الاسم بالإنجليزية"><input class="input ltr" ...${ff('firm_name_en')} /></${Field}>

function MemberForm({ prefill = {}, welcome, onClose }) {
  const [f, setF] = useState({ full_name: '', name_en: '', title_ar: '', title_en: '', phone: '', email: '', password: '', role: 'member', commission: false, avatar_url: '', portals: ['realestate'], re_agent_pct: '', ...prefill });

  const [err, setErr] = useState('');
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const save = () => run(async () => {
    setErr('');
    if (f.role !== 'admin' && !(f.portals || []).length) { setErr('اختر بوابة واحدة على الأقل'); return; }
    try {
      const r = await apiCall('/api/admin', { action: 'create_user', ...f, avatar_url: f.avatar_url || null });
      await refresh();
      toast(r.existing ? 'أُضيف العضو (البريد مسجّل مسبقاً — يستخدم رقمه السري الحالي)' : `تم إنشاء بوابة ${firstName(f.full_name)} ✓`);
      onClose();
    } catch (e) { setErr(errMsg(e)); }
  });
  const hasCo = f.role === 'admin' || (f.portals || []).includes('companies');
  const hasRe = f.role === 'admin' || (f.portals || []).includes('realestate');
  return html`<${Sheet} title=${welcome ? 'الخطوة الأخيرة: بوابة الشريكة' : 'إضافة عضو'} onClose=${onClose} foot=${html`${welcome ? html`<button class="btn" onClick=${onClose}>لاحقاً</button>` : null}<button class="btn primary" onClick=${save} disabled=${busy}>${busy ? html`<${Spinner} />` : html`<${Icon} n="check" />`} إنشاء الحساب</button>`}>
    ${welcome ? html`<p class="muted" style="margin-top:0">تم إعداد حسابك ✓ أنشئ الآن بوابة المحامية نور عيسى لتدخل برقمها السري الخاص وتتابع الشركات والعقارات وعمولتها.</p>` : null}
    <div class="row2"><${Field} label="الاسم"><input class="input" value=${f.full_name} onInput=${set('full_name')} /></${Field}><${Field} label="الاسم بالإنجليزية"><input class="input ltr" value=${f.name_en} onInput=${set('name_en')} /></${Field}></div>
    <div class="row2"><${Field} label="الصفة"><input class="input" value=${f.title_ar} onInput=${set('title_ar')} placeholder=${hasRe && !hasCo ? 'مثال: وسيط عقاري' : ''} /></${Field}><${Field} label="الصفة بالإنجليزية"><input class="input ltr" value=${f.title_en} onInput=${set('title_en')} /></${Field}></div>
    <div class="row2"><${Field} label="البريد (للدخول)"><input class="input ltr" type="email" value=${f.email} onInput=${set('email')} autocomplete="off" /></${Field}><${Field} label="الجوال"><input class="input num" type="tel" value=${f.phone} onInput=${set('phone')} /></${Field}></div>

async function boot() {
  if (!sb) { setS({ boot: 'noconfig' }); return; }
  try {
    const { data, error } = await sb.rpc('crm_status');
    if (error) {
      const m = String(error.message || '');
      if (error.code === 'PGRST202' || /Could not find the function|schema cache|does not exist/i.test(m)) { setS({ boot: 'noschema', bootErr: m }); return; }
      setS({ boot: 'offline', bootErr: /api ?key|JWT|Invalid|401/i.test(m) ? 'مفتاح Supabase غير صحيح أو غير مفعّل — تحقق من متغيرات Vercel ثم أعد النشر.' : m }); return;
    }
    if (!data?.has_admin) { setS({ boot: 'setup' }); return; }
  } catch { setS({ boot: 'offline' }); return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { setS({ boot: 'login' }); return; }
  try { await enter(session); } catch (e) { console.error(e); setS({ boot: 'login' }); }
}

async function enter(session) {
  setS({ session });
  const me = await q(sb.rpc('crm_me'));
  if (!me) { setS({ boot: 'denied' }); return; }
  setS({ me });
  await loadAll();
  // آخر بوابة استُخدمت على هذا الجهاز (لمن يملك البوابتين)
  const h = location.hash.replace(/^#\/?/, '');
  const last = lsGet(`masar-portal:${me.id}`, 'companies');
  const portal = !can('companies') ? 'realestate' : last === 'realestate' && can('realestate') ? 'realestate' : 'companies';
  setS({ portal });
  if (!h && portal === 'realestate') go('aqar');
  setS({ boot: 'app' });
  if (!DEMO) fetch('/api/send-email').then((r) => r.json()).then((j) => setS({ smtp: Boolean(j.configured) })).catch(() => {});
}

if (sb) {
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
      setS({ boot: 'login', me: null, session: null, team: [], settings: null, companies: [], visits: [], payments: [], recent: [], events: [], modal: null,
        reSettings: null, reOwners: [], reProps: [], reFiles: [], reClients: [], reCP: [], reViewings: [], reDeals: [], reActs: [] });
      if (location.hash) location.hash = '';
    }
    else if (session) setS({ session });
  });
}

    const onVis = () => { if (document.visibilityState === 'visible') refresh(); };
    document.addEventListener('visibilitychange', onVis);
    return () => { clearInterval(t); document.removeEventListener('visibilitychange', onVis); };
  }, [s.boot]);
  // البوابة الحالية تتبع الصفحة المفتوحة (الإعدادات تبقى على آخر بوابة)
  const rp = s.boot !== 'app' ? null : route.name === 'home' ? (can('companies') ? 'companies' : 'realestate') : routePortal(route.name);
  useEffect(() => {
    if (s.boot !== 'app' || !rp || rp === s.portal || !can(rp)) return;
    setS({ portal: rp }); lsSet(`masar-portal:${s.me?.id}`, rp);
  }, [s.boot, rp]);

  let body;
  switch (s.boot) {
    case 'loading': body = html`<div class="boot"><img src="assets/brand/emblem.webp" alt="مسار" /></div>`; break;
    case 'noconfig': body = html`<${NoConfig} />`; break;
    case 'noschema': body = html`<${NoSchema} />`; break;
    case 'setup': body = html`<${Setup} />`; break;
    case 'login': body = html`<${Login} />`; break;
    case 'offline': body = html`<${Message} title="تعذّر الاتصال" text=${s.bootErr ? `لا يمكن الوصول إلى قاعدة البيانات: ${s.bootErr}` : 'لا يمكن الوصول إلى قاعدة البيانات الآن. تأكد من الإنترنت ثم أعد المحاولة.'} action=${html`<button class="btn gold" onClick=${() => location.reload()}>إعادة المحاولة</button>`} />`; break;
    case 'denied': body = html`<${Message} title="الحساب غير مفعّل" text="هذا الحساب غير مضاف لفريق مسار أو تم تعطيله. اطلب من المدير تفعيله." action=${html`<button class="btn gold" onClick=${() => sb.auth.signOut()}>تسجيل الخروج</button>`} />`; break;
    default: {
      const fallback = can('companies') ? 'companies' : 'realestate';
      const portal = rp && can(rp) ? rp : can(s.portal) ? s.portal : fallback;
      let page;
      if (rp && !can(rp)) page = html`<${NoAccess} portal=${rp} />`;
      else {
        switch (route.name) {
          case 'companies': page = html`<${Companies} />`; break;
          case 'c': page = html`<${CompanyPage} id=${route.id} key=${route.id} />`; break;
          case 'visits': page = html`<${Visits} />`; break;
          case 'v': page = html`<${VisitPage} id=${route.id} key=${route.id} />`; break;
          case 'letters': page = html`<${Letters} />`; break;
          case 'commission': page = html`<${Commission} />`; break;
          case 'settings': page = html`<${Settings} />`; break;
          case 'more': page = html`<${More} />`; break;
          case 'aqar': page = html`<${ReHome} />`; break;
          case 'props': page = html`<${Props} />`; break;
          case 'prop': page = html`<${PropPage} id=${route.id} key=${route.id} />`; break;
          case 'clients': page = html`<${Clients} />`; break;
          case 'client': page = html`<${ClientPage} id=${route.id} key=${route.id} />`; break;
          case 'owners': page = html`<${Owners} />`; break;
          case 'owner': page = html`<${OwnerPage} id=${route.id} key=${route.id} />`; break;
          case 'deals': page = html`<${Deals} />`; break;
          case 'match': page = html`<${MatchSearch} />`; break;
          case 'aqar-more': page = html`<${ReMore} />`; break;
          default: page = can('companies') ? html`<${Home} />` : html`<${ReHome} />`;
        }
      }
      body = html`<${Shell} route=${route} portal=${portal}>${page}</${Shell}>`;
    }
  }
  return html`${body}<${ModalHost} /><${Toasts} />`;
}

if (STANDALONE) {
  document.addEventListener('click', (e) => {
    const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (a && /p\.html|\.pdf(\?|$)/.test(a.getAttribute('href') || '')) { e.preventDefault(); toast('هذه الميزة تعمل بعد رفع النظام على Vercel'); }
  }, true);
}
render(html`<${App} />`, document.getElementById('app'));

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
})();
</script>
</body>
</html>
