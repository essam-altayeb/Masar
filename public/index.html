function SearchSheet({ onClose }) {
  const s = useS();
  const [term, setTerm] = useState('');
  const ref = useRef(null);
  useEffect(() => { setTimeout(() => ref.current?.focus(), 120); }, []);
  const re = can('realestate') && (s.portal === 'realestate' || !can('companies'));
  const nq = norm(term);
  const res = [];
  if (nq && !re && can('companies')) {
    for (const c of s.companies.filter((x) => norm([x.name, x.contact_name, x.email, x.mobile, x.phone, x.sector, x.area].join(' ')).includes(nq)).slice(0, 30)) {
      res.push({ key: c.id, href: 'c/' + c.id, t: c.name, sub: [c.contact_name, c.mobile, c.email].filter(Boolean).join(' · '), end: html`<${StagePill} k=${c.stage} />` });
    }
  }
  if (nq && re) {
    for (const c of s.reClients.filter((x) => norm([x.name, x.phone, x.whatsapp, x.email].join(' ')).includes(nq)).slice(0, 15)) {
      res.push({ key: c.id, href: 'client/' + c.id, t: c.name, sub: ['عميل', c.phone, requestText(c)].filter(Boolean).join(' · '), end: html`<${LeadPill} c=${c} />` });
    }
    for (const p of s.reProps.filter((x) => norm([propName(x), x.ref, x.area, x.block, x.road, ownerById(x.owner_id)?.name].join(' ')).includes(nq)).slice(0, 15)) {
      res.push({ key: p.id, href: 'prop/' + p.id, t: propName(p), sub: [priceTx(p), p.area].filter(Boolean).join(' · '), end: html`<${StatusPill} s=${p.status} />` });
    }
    for (const o of s.reOwners.filter((x) => norm([x.name, x.phone].join(' ')).includes(nq)).slice(0, 8)) {
      res.push({ key: o.id, href: 'owner/' + o.id, t: o.name, sub: ['مالك', o.phone].filter(Boolean).join(' · '), end: null });
    }
  }
  const open = (r) => { onClose(); go(r.href); };
  return html`<${Sheet} title=${re ? 'بحث في العقارات' : 'بحث'} onClose=${onClose}>
    <div class="search" style="margin-bottom:12px"><${Icon} n="search" /><input ref=${ref} class="input" type="search" placeholder=${re ? 'عميل، رقم عقار، منطقة، مالك...' : 'اسم الشركة، الشخص، الرقم، البريد...'} value=${term} onInput=${(e) => setTerm(e.target.value)} onKeyDown=${(e) => e.key === 'Enter' && res[0] && open(res[0])} /></div>
    ${nq && !res.length ? html`<${Empty} icon="search" title="لا توجد نتائج" />` : null}
    ${res.length ? html`<div class="list" style="box-shadow:none;border:1px solid var(--line-2)">${res.map((r) => html`<button class="row" key=${r.key} onClick=${() => open(r)}>
      <div class="main-col"><div class="t"><span>${r.t}</span></div><div class="s">${r.sub}</div></div>${r.end}</button>`)}</div>` : null}
  </${Sheet}>`;
}

function visitStats(s, v) {
  const list = s.companies.filter((c) => c.visit_id === v.id);
  const reached = list.filter((c) => !['target', 'visited'].includes(c.stage)).length;
  const warm = list.filter((c) => ['interested', 'meeting', 'proposal', 'won'].includes(c.stage)).length;
  const won = list.filter((c) => c.stage === 'won').length;
  return { list, n: list.length, reached, warm, won };
}

function TemplateEditor({ id, onClose }) {
  const s = useS();
  const ex = id ? s.templates.find((t) => t.id === id) : null;
  const [f, setF] = useState(() => (ex ? { ...ex, subject: ex.subject || '' } : { name: '', kind: 'followup', lang: 'ar', channel: 'both', subject: '', body: 'مرحباً {المسؤول}،\n\n\n{رابط_الملف}\n\n{المرسل}\nمكتب الطيب للمحاماة والاستشارات القانونية', is_default: false }));
  const [sample, setSample] = useState(s.companies[0]?.id || '');
  const [tab, setTab] = useState('edit');
  const [busy, run] = useBusy();
  const ta = useRef(null);
  const insert = (k) => {
    const el = ta.current; const token = `{${k}}`;
    if (!el) { setF({ ...f, body: f.body + token }); return; }
    const a = el.selectionStart ?? f.body.length; const b = el.selectionEnd ?? a;
    const body = f.body.slice(0, a) + token + f.body.slice(b);
    setF({ ...f, body });
    setTimeout(() => { el.focus(); el.selectionStart = el.selectionEnd = a + token.length; }, 0);
  };
  const company = s.companies.find((c) => c.id === sample) || { name: 'شركة المثال', contact_name: 'أحمد', public_token: 'example' };
  const save = () => run(async () => {
    if (!f.name.trim() || !f.body.trim()) { toast('الاسم والنص مطلوبان', 'bad'); return; }
    const data = { name: f.name.trim(), kind: f.kind, lang: f.lang, channel: f.channel, subject: f.subject.trim() || null, body: f.body, is_default: Boolean(f.is_default) };
    let row;
    if (ex) row = await q(sb.from('crm_templates').update(data).eq('id', ex.id).select().single());
    else row = await q(sb.from('crm_templates').insert({ ...data, sort: s.templates.length + 1 }).select().single());
    if (data.is_default) {
      const others = s.templates.filter((t) => t.id !== row.id && t.kind === row.kind && t.is_default).map((t) => t.id);
      if (others.length) await q(sb.from('crm_templates').update({ is_default: false }).in('id', others));
    }
    await refresh();
    toast('تم حفظ الخطاب'); onClose();
  });
  const remove = () => {
    if (!ex || !confirm(`حذف «${ex.name}»؟`)) return;
    run(async () => { await q(sb.from('crm_templates').delete().eq('id', ex.id)); setS((x) => ({ templates: x.templates.filter((t) => t.id !== ex.id) })); toast('تم الحذف'); onClose(); });
  };
  return html`<${Sheet} wide title=${ex ? `تعديل: ${ex.name}` : 'خطاب جديد'} onClose=${onClose}
    foot=${html`${ex ? html`<button class="btn danger" style="flex:0 0 auto" onClick=${remove}><${Icon} n="trash" /></button>` : null}<button class="btn primary" onClick=${save} disabled=${busy}><${Icon} n="check" /> حفظ الخطاب</button>`}>
    <${Field} label="اسم الخطاب"><input class="input" value=${f.name} onInput=${(e) => setF({ ...f, name: e.target.value })} placeholder="مثال: متابعة بعد أسبوع" /></${Field}>
    <div class="grid three" style="gap:10px">
      <${Field} label="النوع"><select class="select" value=${f.kind} onChange=${(e) => setF({ ...f, kind: e.target.value })}>${Object.entries(KIND_LABEL).map(([k, v]) => html`<option value=${k}>${v}</option>`)}</select></${Field}>
      <${Field} label="القناة"><select class="select" value=${f.channel} onChange=${(e) => setF({ ...f, channel: e.target.value })}>${Object.entries(CHANNEL_LABEL).map(([k, v]) => html`<option value=${k}>${v}</option>`)}</select></${Field}>
      <${Field} label="اللغة"><select class="select" value=${f.lang} onChange=${(e) => setF({ ...f, lang: e.target.value })}>${Object.entries(LANG_LABEL).map(([k, v]) => html`<option value=${k}>${v}</option>`)}</select></${Field}>
    </div>
    ${f.channel !== 'whatsapp' ? html`<${Field} label="موضوع البريد"><input class="input" value=${f.subject} onInput=${(e) => setF({ ...f, subject: e.target.value })} /></${Field}>` : null}

  </${Sheet}>`;
}

/* ---------- المطابقة: العميل ↔ العقار (نسبة مئوية + الأسباب) ---------- */
// ميزانية الإيجار شهرية — والإيجار السنوي يُقسم على 12 للمقارنة
const monthlyPrice = (p) => (p.purpose === 'rent' && p.price_period === 'year' ? Number(p.price) / 12 : Number(p.price));
function matchProperty(req, p, { anyStatus = false } = {}) {
  if (!p) return null;
  if (!anyStatus && p.status !== 'available') return null;
  const wp = req.want_purpose;
  if (wp === 'buy' && !['sale', 'investment'].includes(p.purpose)) return null;
  if (wp === 'rent' && p.purpose !== 'rent') return null;
  if (wp === 'invest' && !['sale', 'investment'].includes(p.purpose)) return null;
  const types = req.want_types || [];
  if (types.length && !types.includes(p.category)) return null;
  const parts = [];
  const add = (w, s, ok, label) => parts.push({ w, s: Math.max(0, Math.min(1, s)), ok, label });

  const min = Number(req.budget_min) || 0; const max = Number(req.budget_max) || 0;
  if (min || max) {
    if (p.price == null || p.price === '') add(35, 0.5, false, 'السعر غير محدد');
    else {
      const price = monthlyPrice(p);
      if (max && price > max) { const over = (price - max) / max; add(35, 1 - over * 4, false, `فوق الميزانية ${Math.max(1, Math.round(over * 100))}%`); }
      else if (min && price < min) { const under = (min - price) / min; add(35, Math.max(0.6, 1 - under * 1.5), true, 'أقل من الميزانية'); }
      else if (min && max && max > min) add(35, 1 - 0.15 * ((price - min) / (max - min)), true, 'ضمن الميزانية');
      else add(35, 1, true, 'ضمن الميزانية');
    }
  }
  const areas = req.want_areas || [];
  if (areas.length) {
    const hit = Boolean(p.area) && areas.some((a) => norm(a) === norm(p.area));
    add(25, hit ? 1 : 0, hit, hit ? p.area : `منطقة أخرى${p.area ? ` (${p.area})` : ''}`);
  }
  const count = (want, have, w, tx) => {
    if (!want) return;
    if (have == null) { add(w, 0.5, false, `${tx(want)}؟`); return; }
    const s = have >= want ? 1 : have === want - 1 ? 0.5 : 0;
    add(w, s, s === 1, tx(have));
  };
  count(Number(req.min_bedrooms) || 0, p.bedrooms, 15, roomsTx);
  count(Number(req.min_bathrooms) || 0, p.bathrooms, 8, bathsTx);
  count(Number(req.min_parking) || 0, p.parking, 5, parkTx);
  const wantSize = Number(req.min_area) || 0;
  if (wantSize) {
    const size = Number(p.category === 'land' ? p.land_area : (p.built_area || p.land_area)) || 0;
    if (!size) add(10, 0.5, false, 'المساحة؟');
    else { const r = size / wantSize; add(10, r >= 1 ? 1 : r >= 0.9 ? 0.6 : r >= 0.8 ? 0.3 : 0, r >= 1, fmtM2(size)); }
  }
  if (req.want_furnished) {
    const f = p.furnished;
    const s = !f ? 0.5 : f === req.want_furnished ? 1 : f === 'semi' ? 0.5 : 0;
    add(4, s, s === 1, f ? RE_FURNISHED[f] : 'الفرش؟');
  }
  const feats = req.want_features || [];
  if (feats.length) {
    const have = feats.filter((x) => (p.features || []).includes(x));
    add(6, have.length / feats.length, have.length === feats.length, have.length ? have.map((x) => RE_FEATURE[x]).join('، ') : `بدون ${RE_FEATURE[feats[0]] || 'المميزات'}`);
  }
  const W = parts.reduce((a, x) => a + x.w, 0);

/* ---------- تقييم العميل (Lead Score) — يرتفع تلقائياً ---------- */
function leadAuto(c) {
  const s = S(); let pts = 0; const why = [];
  if (c.budget_min || c.budget_max) { pts += 15; why.push('حدد الميزانية'); }
  if ((c.want_areas || []).length) { pts += 10; why.push('حدد المنطقة'); }
  if ((c.want_types || []).length && c.want_purpose) pts += 5;
  if (c.min_bedrooms || c.min_area) pts += 5;
  const cps = s.reCP.filter((x) => x.client_id === c.id);
  if (cps.length >= 2) { pts += 10; why.push(`طلب ${propsTx(cps.length)}`); }
  const liked = cps.filter((x) => ['liked', 'viewing', 'viewed', 'offer'].includes(x.status)).length;
  if (liked) { pts += 15; why.push(liked > 1 ? `أعجبه ${liked}` : 'أعجبه عقار'); }
  if (s.reViewings.some((v) => v.client_id === c.id && v.status !== 'cancelled')) { pts += 25; why.push('حجز معاينة'); }
  if (s.reDeals.some((d) => d.client_id === c.id && ['negotiation', 'reserved'].includes(d.status))) { pts += 30; why.push('صفقة قيد التفاوض'); }
  if (c.last_contact_at) {
    const days = (Date.now() - new Date(c.last_contact_at).getTime()) / 864e5;
    if (days <= 7) pts += 10; else if (days > 45) { pts -= 10; why.push('لا تواصل منذ مدة'); }
  }
  const k = pts >= 75 ? 'very_hot' : pts >= 50 ? 'hot' : pts >= 25 ? 'warm' : 'cold';
  return { k, pts, why };
}

const MIME_BY_EXT = { mp4: 'video/mp4', m4v: 'video/x-m4v', mov: 'video/quicktime', qt: 'video/quicktime', webm: 'video/webm', '3gp': 'video/3gpp',
  pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', heic: 'image/heic', heif: 'image/heif',
  doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  xls: 'application/vnd.ms-excel', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' };
const VIDEO_MIMES = ['video/mp4', 'video/quicktime', 'video/webm', 'video/3gpp', 'video/x-m4v'];
function mimeOf(f) {
  const t = String(f.type || '').toLowerCase();
  if (t && t !== 'application/octet-stream') return t;
  const ext = (String(f.name || '').toLowerCase().match(/\.([a-z0-9]{1,5})$/) || [])[1];
  return MIME_BY_EXT[ext] || 'application/octet-stream';
}
async function reUploadFiles(propertyId, files, kind, onProgress) {
  const list = [...files];
  if (!list.length) return [];
  const maxMb = kind === 'video' ? 50 : 25;
  const prepared = [];
  for (const f of list) {
    if (kind === 'photo') {
      if (!/^image\//.test(f.type || '') && !/\.(jpe?g|png|webp|heic|heif|gif)$/i.test(f.name || '')) throw new Error(`«${f.name}» ليس صورة`);
      const full = await compressImage(f, 1800, 0.8);
      const thumb = await compressImage(f, 560, 0.72);
      prepared.push({ name: String(f.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', full, thumb });
    } else {
      if (f.size > maxMb * 1048576) throw new Error(`الملف «${f.name}» أكبر من ${maxMb} ميغابايت`);
      const mime = mimeOf(f);
      if (kind === 'video' && !VIDEO_MIMES.includes(mime)) throw new Error(`«${f.name}» ليس فيديو مدعوماً — استخدم MP4 أو MOV`);
      // بعض الهواتف لا تحدد نوع الملف: نثبّته حتى تقبله مساحة التخزين
      prepared.push({ name: f.name || 'file', mime, file: f.type === mime ? f : new Blob([f], { type: mime }) });
    }
  }
  const baseSort = filesOf(propertyId).reduce((m, x) => Math.max(m, x.sort || 0), 0) + 1;
  const rows = [];
  try {
    if (DEMO) {
      for (let i = 0; i < prepared.length; i++) {
        const x = prepared[i];
        if (x.file && x.file.size > 2.5 * 1048576) { toast(`في التجربة: الملفات الكبيرة (${x.name}) تُرفع بعد النشر فقط`, 'bad'); continue; }
        const data = x.full || await readAsDataUrl(x.file);
        const row = await q(sb.from('re_files').insert({ property_id: propertyId, kind, bucket: kind === 'photo' || kind === 'video' ? 're-media' : 're-docs', path: `demo/${demoUid()}`, name: x.name, mime: x.mime, size: Math.round(data.length * 0.75), is_public: kind === 'photo' || kind === 'video', sort: baseSort + i, data, thumb_data: x.thumb || null }).select().single());
        rows.push(row); onProgress && onProgress(i + 1, prepared.length);
      }
    } else {
      // الخادم يعطي 20 رابط رفع كحد أقصى في الطلب — نرفع على دفعات
      for (let start = 0; start < prepared.length; start += 20) {
        const chunk = prepared.slice(start, start + 20);
        const r = await apiCall('/api/re-files', { action: 'upload', property_id: propertyId, files: chunk.map((x) => ({ kind, name: x.name, mime: x.mime, size: x.file ? x.file.size : x.full.length, thumb: kind === 'photo' })) });
        for (let j = 0; j < chunk.length; j++) {
          const i = start + j; const u = r.files[j]; const x = chunk[j];
          const body = x.full ? dataUrlToBlob(x.full) : x.file;
          const up = await sb.storage.from(u.bucket).uploadToSignedUrl(u.path, u.token, body, { contentType: x.mime });
          if (up.error) throw up.error;
          if (u.thumb_path) {
            const tu = await sb.storage.from(u.bucket).uploadToSignedUrl(u.thumb_path, u.thumb_token, dataUrlToBlob(x.thumb), { contentType: 'image/jpeg' });
            if (tu.error) throw tu.error;
          }
          const row = await q(sb.from('re_files').insert({ property_id: propertyId, kind: u.kind, bucket: u.bucket, path: u.path, thumb_path: u.thumb_path || null, name: x.name, mime: x.mime, size: body.size, is_public: kind === 'photo' || kind === 'video', sort: baseSort + i }).select().single());
          rows.push(row); onProgress && onProgress(i + 1, prepared.length);
        }
      }
    }
  } finally {
    // ما رُفع قبل أي خطأ يبقى ظاهراً
    if (rows.length) setS((s) => ({ reFiles: [...s.reFiles, ...rows], tick: s.tick + 1 }));
  }
  return rows;
}

      </div></div>`;
  })}</div>`;
}
function useReActs(filter, deps) {
  const [acts, setActs] = useState(null);
  const s = useS();
  useEffect(() => {
    let alive = true;
    let qb = sb.from('re_activities').select('*');
    for (const [k, v] of Object.entries(filter)) qb = qb.eq(k, v);
    q(qb.order('happened_at', { ascending: false }).limit(300)).then((a) => { if (alive) setActs(a); }).catch(fail);
    return () => { alive = false; };
  }, [...deps, s.tick]);
  return acts;
}

function filterProps(s, { skipCat } = {}) {
  const f = s.reF;
  let list = s.reProps;
  if (f.pq) {
    const nq = norm(f.pq);
    list = list.filter((p) => norm([propName(p), p.ref, p.area, p.governorate, p.block, p.road, p.building, ownerById(p.owner_id)?.name, p.description, p.notes, catOf(p).label, p.subtype].join(' ')).includes(nq));
  }
  if (!skipCat && f.pcat !== 'all') list = list.filter((p) => p.category === f.pcat);
  if (f.ppurpose !== 'all') list = list.filter((p) => p.purpose === f.ppurpose);
  if (f.pstatus !== 'all') list = list.filter((p) => p.status === f.pstatus);
  if (f.pmine) list = list.filter((p) => p.agent_id === s.me?.id);
  const sorters = {
    new: (a, b) => String(b.created_at).localeCompare(String(a.created_at)),
    price_asc: (a, b) => (Number(a.price) || 9e15) - (Number(b.price) || 9e15),
    price_desc: (a, b) => (Number(b.price) || 0) - (Number(a.price) || 0),
    ref: (a, b) => (a.ref || 0) - (b.ref || 0),
  };
  const order = { available: 0, reserved: 1, rented: 2, sold: 3, off: 4 };
  return [...list].sort((a, b) => (f.pstatus === 'all' ? order[a.status] - order[b.status] : 0) || (sorters[f.psort] || sorters.new)(a, b));
}

      <div class="co-title"><h1>${propName(p)}</h1><div class="s">${[catOf(p).label, RE_PURPOSE[p.purpose]?.label, propPlace(p), `رقم ${p.ref}`].filter(Boolean).join(' · ')}</div></div>
      <button class="icon-btn" aria-label="تعديل" onClick=${() => openModal('prop', { id: p.id })}><${Icon} n="edit" /></button>
    </div>

    <div class="grid main-side" style="margin-top:12px">
      <div class="stack">
        <section class="card" style="padding:12px">
          ${photos.length || videos.length ? html`<div class="gallery">
              ${photos.map((f, i) => html`<button class="g" key=${f.id} onClick=${() => setLb(f)} aria-label=${`صورة ${i + 1}`}><img src=${mediaUrl(f, i > 0)} alt="" loading=${i ? 'lazy' : 'eager'} />${i === 0 ? html`<span class="cover-tag">الغلاف</span>` : null}</button>`)}
              ${videos.map((f) => html`<div class="g" key=${f.id}><video src=${mediaUrl(f)} controls preload="metadata" playsinline></video><button class="icon-btn del" aria-label="حذف الفيديو" onClick=${() => delFile(f)}><${Icon} n="trash" size=${16} /></button></div>`)}
            </div>` : html`<div class="gallery-empty" style=${`--c:${catOf(p).c}`}><${Icon} n=${catOf(p).icon} /><span>لا توجد صور بعد</span></div>`}
          <div class="btn-row" style="margin-top:10px">
            <button class="btn sm" disabled=${!!busy} onClick=${() => photoRef.current?.click()}>${busy === 'photo' ? html`<${Spinner} />` : html`<${Icon} n="camera" />`} إضافة صور</button>
            <button class="btn sm" disabled=${!!busy} onClick=${() => videoRef.current?.click()}>${busy === 'video' ? html`<${Spinner} />` : html`<${Icon} n="video" />`} فيديو</button>
            ${videoHref ? html`<a class="btn sm" href=${videoHref} target="_blank" rel="noopener"><${Icon} n="external" /> رابط الفيديو</a>` : null}
            <input ref=${photoRef} type="file" accept="image/*" multiple class="hide" onChange=${(e) => upload(e, 'photo')} />
            <input ref=${videoRef} type="file" accept="video/*" class="hide" onChange=${(e) => upload(e, 'video')} />
          </div>
        </section>

        <section class="card">
          <div class="price-line"><b class="num">${priceTx(p)}</b>${p.negotiable && p.price ? html`<span class="pill" style="--c:#2e7d5b">قابل للتفاوض</span>` : null}<span class="grow"></span><${StatusPill} s=${p.status} /></div>
          ${p.owner_price ? html`<div class="hint">سعر المالك: <span class="num">${fmtBD(p.owner_price)} د.ب</span>${p.price ? html` · الفرق <span class="num">${fmtBD(Number(p.price) - Number(p.owner_price))}</span>` : null} (داخلي — لا يظهر للعميل)</div>` : null}
          <div class="chips" style="margin-top:10px">${Object.entries(RE_STATUS).map(([k, v]) => html`<button class=${'chip' + (p.status === k ? ' on' : '')} onClick=${() => setStatus(k)}><span class="dot" style=${`--c:${v.c}`}></span>${v.label}</button>`)}</div>
          <button class="btn gold block" style="min-height:50px;margin-top:10px" onClick=${() => openModal('resend', { propIds: [p.id] })}><${Icon} n="send" /> أرسل هذا العقار لعميل</button>
          <div class="actions" style="margin-top:8px">
            <a class="btn" href=${ownerPhone ? waLink(ownerPhone, '') : '#'} target="_blank" rel="noopener" style=${ownerPhone ? '' : 'opacity:.5;pointer-events:none'}><${Icon} n="wa" /> المالك</a>
            <a class="btn" href=${mapHref || '#'} target="_blank" rel="noopener" style=${mapHref ? '' : 'opacity:.5;pointer-events:none'}><${Icon} n="map" /> الخريطة</a>
            <button class="btn" onClick=${copySummary}><${Icon} n="copy" /> نسخ الوصف</button>
            <button class="btn" onClick=${() => openModal('deal', { propertyId: p.id })}><${Icon} n="deal" /> صفقة</button>
          </div>
        </section>

        ${specs.length ? html`<section class="card"><div class="card-title"><${Icon} n="ruler" /> المواصفات</div>
          <div class="specgrid">${specs.map((x) => html`<div class="spec"><${Icon} n=${x.i} /><div><b class="num">${x.v}</b><span>${x.k}</span></div></div>`)}</div>
          ${(p.features || []).length ? html`<div class="chip-wrap" style="margin-top:12px">${p.features.map((x) => html`<span class="feat">✓ ${RE_FEATURE[x] || x}</span>`)}</div>` : null}
        </section>` : null}

        ${p.description || p.notes ? html`<section class="card">
          ${p.description ? html`<div class="card-title"><${Icon} n="note" /> الوصف</div><div style="white-space:pre-wrap">${p.description}</div>` : null}
          ${p.notes ? html`<div class="card-title" style=${p.description ? 'margin-top:14px' : ''}><${Icon} n="lock" /> ملاحظات داخلية</div><div style="white-space:pre-wrap;color:var(--ink-2)">${p.notes}</div>` : null}
        </section>` : null}

        <section class="card">
          <div class="card-title"><${Icon} n="users" /> العملاء والعقار<span class="grow"></span><span class="muted small num">${linked.length}</span></div>
          ${linked.length ? html`<div class="list flat">${linked.map(({ x, c }) => html`<${ClientRow} c=${c} key=${c.id} right=${html`<span class="pill" style=${`--c:${RE_CP[x.status]?.c}`}>${RE_CP[x.status]?.label}${x.reason ? ` · ${x.reason}` : ''}</span>`} />`)}</div>`
            : html`<div class="muted small">لم يُرسل لأي عميل بعد.</div>`}
          ${fits.length ? html`<div class="section-label">عملاء يناسبهم هذا العقار</div>
            <div class="list flat">${fits.map(({ c, m }) => html`<${ClientRow} c=${c} key=${c.id} right=${html`<div class="end"><${MatchBadge} score=${m.score} /><button class="btn sm" onClick=${(e) => { e.stopPropagation(); openModal('resend', { clientId: c.id, propIds: [p.id] }); }}><${Icon} n="send" /> أرسل</button></div>`} />`)}</div>` : null}
        </section>

        ${views.length ? html`<section class="card"><div class="card-title"><${Icon} n="calendar" /> المعاينات</div>
          <div class="list flat">${views.slice(0, 10).map((v) => html`<${ViewingRow} v=${v} key=${v.id} />`)}</div></section>` : null}

        <section class="card">
          <div class="card-title"><${Icon} n="route" /> سجل العقار</div>
          <${ReTimeline} acts=${acts} />
        </section>
      </div>

      <div class="stack">
        <section class="card">
          <div class="card-title"><${Icon} n="map" /> الموقع</div>
          <div class="info-list">
            ${p.governorate ? html`<div class="info"><span class="k">المحافظة</span><span class="v">${p.governorate}</span></div>` : null}
            <div class="info"><span class="k">المنطقة</span><span class="v">${p.area || '—'}</span></div>
            ${p.block || p.road || p.building ? html`<div class="info"><span class="k">العنوان</span><span class="v">${[p.block && `مجمع ${p.block}`, p.road && `طريق ${p.road}`, p.building && `مبنى ${p.building}`, p.unit && `شقة ${p.unit}`].filter(Boolean).join(' · ')}</span></div>` : null}
            ${mapHref ? html`<div class="info"><span class="k">الخريطة</span><span class="v"><a href=${mapHref} target="_blank" rel="noopener">فتح الموقع 📍</a></span></div>` : null}
          </div>
        </section>

        <section class="card">
          <div class="card-title"><${Icon} n="key" /> المالك<span class="grow"></span>${owner ? html`<button class="link-btn" onClick=${() => go('owner/' + owner.id)}>ملف المالك</button>` : null}</div>
          ${owner ? html`<div class="info-list">
              <div class="info"><span class="k">الاسم</span><span class="v">${owner.name}</span></div>
              ${owner.phone ? html`<div class="info"><span class="k">الهاتف</span><span class="v"><a class="num" href=${telHref(owner.phone)}>${owner.phone}</a></span></div>` : null}
              ${owner.agreement_type ? html`<div class="info"><span class="k">الاتفاق</span><span class="v">${RE_AGREEMENT[owner.agreement_type]}${owner.commission_pct != null ? ` · عمولة ${Number(owner.commission_pct)}%` : ''}</span></div>` : null}
              ${owner.agreement_end ? html`<div class="info"><span class="k">ينتهي</span><span class="v">${fmtFull(owner.agreement_end)}</span></div>` : null}
            </div>`
            : html`<div class="muted small">لم يُحدد المالك. <button class="link-btn" onClick=${() => openModal('prop', { id: p.id })}>تحديد</button></div>`}
        </section>

        <section class="card">
          <div class="card-title"><${Icon} n="file" /> المستندات</div>
          ${docs.length ? docs.map((f) => html`<div class="info" key=${f.id}>
              <${Icon} n=${f.kind === 'plan' ? 'plan' : 'file'} />
              <span class="v"><button class="link-btn" style="font-size:14px;color:var(--ink)" onClick=${() => reOpenDoc(f)}>${RE_FILE_KIND[f.kind]}${f.name ? ` — ${f.name}` : ''}</button></span>
              ${isAdmin() ? html`<button class="icon-btn" aria-label="حذف" onClick=${() => delFile(f)}><${Icon} n="trash" size=${16} /></button>` : null}
            </div>`) : html`<div class="muted small">وثيقة الملكية، المخطط، أو أي مستند — تبقى خاصة بالفريق.</div>`}
          <div style="display:flex;gap:8px;margin-top:10px">
            <select class="select" style="flex:1" value=${docKind} onChange=${(e) => setDocKind(e.target.value)} aria-label="نوع المستند">
              <option value="deed">وثيقة الملكية</option><option value="plan">مخطط</option><option value="other">مستند آخر</option>
            </select>
            <button class="btn sm" disabled=${!!busy} onClick=${() => docRef.current?.click()}>${busy && !['photo', 'video'].includes(busy) ? html`<${Spinner} />` : html`<${Icon} n="plus" />`} رفع</button>
            <input ref=${docRef} type="file" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx" class="hide" onChange=${(e) => upload(e, docKind)} />
          </div>
        </section>

        <section class="card">
          <div class="card-title"><${Icon} n="user" /> المتابعة</div>
          <div class="info-list">
            <div class="info"><span class="k">الموظف</span><span class="v"><${MemberSelect} value=${p.agent_id} empty="—" onChange=${async (v) => { try { await reSave('re_properties', { agent_id: v }, p.id); toast('تم التحديث'); } catch (e) { fail(e); } }} /></span></div>
            <div class="info"><span class="k">أُضيف</span><span class="v">${fmtFull(String(p.created_at).slice(0, 10))}${memberById(p.created_by) ? ` · ${firstName(memberById(p.created_by).full_name)}` : ''}</span></div>
            ${p.status_at ? html`<div class="info"><span class="k">آخر حالة</span><span class="v">${ago(p.status_at)}</span></div>` : null}
          </div>
        </section>

        ${deals.length ? html`<section class="card"><div class="card-title"><${Icon} n="deal" /> الصفقات</div>
          ${deals.map((d) => html`<${DealRow} d=${d} key=${d.id} />`)}</section>` : null}

        ${isAdmin() ? html`<button class="btn danger block" onClick=${remove}><${Icon} n="trash" /> حذف العقار</button>` : null}
      </div>
    </div>
    ${lb ? html`<${Lightbox} src=${mediaUrl(lb)} alt=${propName(p)} name=${lb.name || 'photo.jpg'} onClose=${() => setLb(null)}
      extra=${photos[0]?.id !== lb.id ? html`<button class="btn sm" style="background:var(--paper)" onClick=${() => { const f = lb; setLb(null); makeCover(f); }}><${Icon} n="star" /> اجعلها الغلاف</button>` : null}
      onDelete=${() => { const f = lb; setLb(null); delFile(f); }} />` : null}
  </div>`;
}

/* =====================================================================
   30) العقارات — نموذج العقار
   ===================================================================== */
const EMPTY_PROP = { category: '', subtype: '', category_other: '', purpose: 'sale', status: 'available', price: '', price_period: 'month', owner_price: '', negotiable: true,
  owner_id: '', agent_id: '', governorate: '', area: '', block: '', road: '', building: '', unit: '', map_url: '', lat: null, lng: null,
  land_area: '', built_area: '', bedrooms: null, bathrooms: null, parking: null, floors: null, age_years: '', furnished: null, features: [], video_url: '', description: '', notes: '', title: '' };

function PropForm({ id, ownerId, onClose }) {
  const s = useS();
  const ex = id ? propById(id) : null;
  const [f, setF] = useState(() => {
    if (!ex) return { ...EMPTY_PROP, owner_id: ownerId || '', agent_id: s.me?.id || '' };
    const o = { ...EMPTY_PROP };
    for (const k of Object.keys(EMPTY_PROP)) if (ex[k] != null) o[k] = ex[k];
    return o;
  });
  const [newOwner, setNewOwner] = useState(null);
  const [photos, setPhotos] = useState([]);
  const [busy, run] = useBusy();
  const [err, setErr] = useState('');
  const fileRef = useRef(null);
  const set = (k) => (e) => setF({ ...f, [k]: e && e.target ? e.target.value : e });
  const cat = RE_CAT[f.category];
  const isLand = f.category === 'land';
  const locate = () => {
    if (!navigator.geolocation) { toast('الموقع غير متاح في هذا المتصفح', 'bad'); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => { const lat = +pos.coords.latitude.toFixed(6); const lng = +pos.coords.longitude.toFixed(6); setF((x) => ({ ...x, lat, lng, map_url: `https://maps.google.com/?q=${lat},${lng}` })); toast('تم تحديد الموقع الحالي 📍'); },
      () => toast('تعذّر تحديد الموقع — اسمح للمتصفح بالوصول للموقع', 'bad'), { enableHighAccuracy: true, timeout: 12000 });
  };
  const save = () => run(async () => {
    setErr('');
    if (!f.category) { setErr('اختر نوع العقار'); return; }
    const price = numOrNull(f.price); const ownerPrice = numOrNull(f.owner_price);
    if (f.price !== '' && f.price != null && price == null) { setErr('السعر غير صحيح'); return; }
    const mapUrl = cleanUrl(f.map_url); const videoUrl = cleanUrl(f.video_url);
    if (mapUrl === undefined) { setErr('رابط الخريطة غير صحيح — الصق رابطاً يبدأ بـ https://'); return; }
    if (videoUrl === undefined) { setErr('رابط الفيديو غير صحيح — الصق رابطاً يبدأ بـ https://'); return; }
    let owner_id = f.owner_id || null;
    if (newOwner && newOwner.name.trim()) {
      const o = await reSave('re_owners', { name: newOwner.name.trim(), phone: newOwner.phone.trim() || null, whatsapp: newOwner.phone.trim() || null });
      owner_id = o.id;
    }
    const data = {
      category: f.category, subtype: f.subtype || null, category_other: f.category === 'other' ? f.category_other.trim() || null : null,
      purpose: f.purpose, status: f.status, price, price_period: f.purpose === 'rent' ? f.price_period || 'month' : null, owner_price: ownerPrice, negotiable: Boolean(f.negotiable),
      owner_id, agent_id: f.agent_id || null, governorate: f.governorate || null, area: f.area.trim() || null, block: String(f.block || '').trim() || null,
      road: String(f.road || '').trim() || null, building: String(f.building || '').trim() || null, unit: String(f.unit || '').trim() || null,
      map_url: mapUrl, lat: f.lat, lng: f.lng,
      land_area: numOrNull(f.land_area), built_area: isLand ? null : numOrNull(f.built_area),
      bedrooms: isLand ? null : f.bedrooms, bathrooms: isLand ? null : f.bathrooms, parking: f.parking, floors: isLand ? null : f.floors,
      age_years: isLand ? null : intOrNull(f.age_years), furnished: isLand ? null : f.furnished || null, features: f.features || [],
      video_url: videoUrl, description: f.description.trim() || null, notes: f.notes.trim() || null, title: f.title.trim() || null,
    };
    const row = await reSave('re_properties', data, ex?.id);
    if (!ex) await reLog({ property_id: row.id, type: 'created', body: `أُضيف ${propName(row)}${owner_id ? ` — المالك: ${ownerById(owner_id)?.name || ''}` : ''}` });
    else if (ex.status !== row.status) await reLog({ property_id: row.id, type: 'status', body: `${RE_STATUS[ex.status]?.label} ← ${RE_STATUS[row.status]?.label}`, meta: { from: ex.status, to: row.status } });
    if (photos.length) {
      try { await reUploadFiles(row.id, photos.map((x) => x.file), 'photo', (i, n) => toast(`رفع الصور ${i} / ${n}`)); } catch (e) { fail(e); }
    }
    toast(ex ? 'تم حفظ العقار' : `أُضيف «${propName(row)}» ✓`);
    onClose();
    if (!ex) go('prop/' + row.id);
  });

  const foot = html`<button class="btn" onClick=${onClose}>إلغاء</button><button class="btn primary" onClick=${save} disabled=${busy}>${busy ? html`<${Spinner} />` : html`<${Icon} n="check" />`} ${ex ? 'حفظ' : 'إضافة العقار'}</button>`;
  return html`<${Sheet} title=${ex ? `تعديل ${propName(ex)}` : 'عقار جديد'} onClose=${onClose} foot=${foot} wide>
    <${AreasDatalist} />
    <div class="form-sec">نوع العقار</div>
    <${CatPicker} value=${f.category} onChange=${(v) => setF({ ...f, category: v, subtype: '' })} />
    ${cat && cat.subs.length ? html`<div style="margin-top:10px"><${ChipPick} options=${cat.subs.map((x) => [x, x])} value=${f.subtype || null} onChange=${(v) => setF({ ...f, subtype: v || '' })} /></div>` : null}
    ${f.category === 'other' ? html`<${Field} label="اكتب النوع"><input class="input" value=${f.category_other} onInput=${set('category_other')} placeholder="مثال: فندق، مدرسة، محطة..." /></${Field}>` : null}

    <div class="form-sec">الغرض والحالة</div>
    <div class="row2">
      <${Group} label="الغرض"><${ChipPick} options=${Object.entries(RE_PURPOSE).map(([k, v]) => [k, v.label])} value=${f.purpose} allowEmpty=${false} onChange=${(v) => setF({ ...f, purpose: v })} /></${Group}>
      <${Field} label="الحالة"><select class="select" value=${f.status} onChange=${set('status')}>${Object.entries(RE_STATUS).map(([k, v]) => html`<option value=${k}>${v.label}</option>`)}</select></${Field}>
    </div>

    <div class="form-sec">السعر</div>
    <div class="row2">
      <${Field} label=${f.purpose === 'rent' ? 'الإيجار (د.ب)' : 'سعر العرض للعملاء (د.ب)'}><input class="input num" inputmode="decimal" value=${f.price ?? ''} onInput=${set('price')} placeholder="0" /></${Field}>
      ${f.purpose === 'rent' ? html`<${Group} label="المدة"><${ChipPick} options=${[['month', 'شهرياً'], ['year', 'سنوياً']]} value=${f.price_period || 'month'} allowEmpty=${false} onChange=${(v) => setF({ ...f, price_period: v })} /></${Group}>`
        : html`<${Field} label="سعر المالك (داخلي)"><input class="input num" inputmode="decimal" value=${f.owner_price ?? ''} onInput=${set('owner_price')} placeholder="اختياري" /></${Field}>`}
    </div>
    ${f.purpose === 'rent' ? html`<${Field} label="سعر المالك (داخلي)"><input class="input num" inputmode="decimal" value=${f.owner_price ?? ''} onInput=${set('owner_price')} placeholder="اختياري" /></${Field}>` : null}
    <label class="check" style="margin-top:0"><input type="checkbox" checked=${f.negotiable} onChange=${(e) => setF({ ...f, negotiable: e.target.checked })} /><span>قابل للتفاوض</span></label>

    <div class="form-sec">المالك والموظف المسؤول</div>
    <div class="row2">
      <${Group} label="المالك">
        ${newOwner ? html`<div style="display:grid;gap:6px"><input class="input" placeholder="اسم المالك" value=${newOwner.name} onInput=${(e) => setNewOwner({ ...newOwner, name: e.target.value })} />
            <input class="input num" type="tel" placeholder="هاتف المالك" value=${newOwner.phone} onInput=${(e) => setNewOwner({ ...newOwner, phone: e.target.value })} />
            <button type="button" class="link-btn" style="text-align:start" onClick=${() => setNewOwner(null)}>اختيار مالك موجود</button></div>`
          : html`<select class="select" value=${f.owner_id || ''} onChange=${(e) => (e.target.value === '__new' ? setNewOwner({ name: '', phone: '' }) : setF({ ...f, owner_id: e.target.value }))}>
            <option value="">—</option><option value="__new">+ مالك جديد</option>${s.reOwners.map((o) => html`<option value=${o.id}>${o.name}</option>`)}</select>`}
      </${Group}>
      <${Field} label="الموظف المسؤول"><${MemberSelect} value=${f.agent_id} empty="—" onChange=${(v) => setF({ ...f, agent_id: v || '' })} /></${Field}>
    </div>

    <div class="form-sec">الموقع</div>
    <div class="row2">
      <${Field} label="المحافظة"><select class="select" value=${f.governorate || ''} onChange=${set('governorate')}><option value="">—</option>${RE_GOVS.map((g) => html`<option>${g}</option>`)}</select></${Field}>
      <${Field} label="المنطقة"><input class="input" list="re-areas" value=${f.area} onInput=${set('area')} placeholder="مثال: الرفاع" /></${Field}>
    </div>
    <div class="row4">
      <${Field} label="المجمع"><input class="input num" inputmode="numeric" value=${f.block} onInput=${set('block')} /></${Field}>
      <${Field} label="الطريق"><input class="input num" inputmode="numeric" value=${f.road} onInput=${set('road')} /></${Field}>
      <${Field} label="المبنى"><input class="input num" value=${f.building} onInput=${set('building')} /></${Field}>
      <${Field} label="الشقة/المحل"><input class="input num" value=${f.unit} onInput=${set('unit')} /></${Field}>
    </div>
    <${Field} label="الموقع على الخريطة 📍" hint="الصق رابط Google Maps، أو اضغط «موقعي الحالي» وأنت عند العقار.">
      <div style="display:flex;gap:8px"><input class="input ltr" value=${f.map_url} onInput=${set('map_url')} placeholder="https://maps.app.goo.gl/..." /><button type="button" class="btn sm" onClick=${locate}><${Icon} n="crosshair" /> موقعي الحالي</button></div>
    </${Field}>

    <div class="form-sec">المواصفات</div>
    <div class="row2">
      <${Field} label="مساحة الأرض (م²)"><input class="input num" inputmode="decimal" value=${f.land_area ?? ''} onInput=${set('land_area')} /></${Field}>

function filterClients(s) {
  const f = s.reF; const t = todayISO();
  let list = s.reClients;
  if (f.cq) {
    const nq = norm(f.cq);
    list = list.filter((c) => norm([c.name, c.phone, c.whatsapp, c.email, c.nationality, requestText(c), c.notes, c.request_notes].join(' ')).includes(nq));
  }
  if (f.cstatus !== 'all') list = list.filter((c) => c.status === f.cstatus);
  if (f.clead === 'hot') list = list.filter(isHot);
  else if (f.clead !== 'all') list = list.filter((c) => leadOf(c) === f.clead);
  if (f.ckind !== 'all') list = list.filter((c) => c.kind === f.ckind);
  if (f.cdue) list = list.filter((c) => c.status === 'active' && c.next_followup && c.next_followup <= t);
  if (f.cmine) list = list.filter((c) => c.agent_id === s.me?.id);
  const sorters = {
    lead: (a, b) => LEAD_ORDER.indexOf(leadOf(a)) - LEAD_ORDER.indexOf(leadOf(b)) || (a.next_followup || '9999').localeCompare(b.next_followup || '9999'),
    followup: (a, b) => (a.next_followup || '9999').localeCompare(b.next_followup || '9999'),
    new: (a, b) => String(b.created_at).localeCompare(String(a.created_at)),
    name: (a, b) => a.name.localeCompare(b.name, 'ar'),
  };
  return [...list].sort(sorters[f.csort] || sorters.lead);
}

function exportClients() {
  const s = S();
  const rows = [['العميل', 'الهاتف', 'واتساب', 'البريد', 'الجنسية', 'النوع', 'المصدر', 'الحالة', 'التقييم', 'الطلب', 'الميزانية من', 'الميزانية إلى', 'المناطق', 'الموظف', 'أول تواصل', 'آخر تواصل', 'المتابعة القادمة', 'ملاحظات']];
  for (const c of s.reClients) {
    rows.push([c.name, c.phone, c.whatsapp, c.email, c.nationality, RE_KIND[c.kind]?.label, RE_SOURCES[c.source] || '', RE_CLIENT_STATUS[c.status]?.label, LEADS[leadOf(c)]?.en,
      [(c.want_types || []).map((t) => RE_CAT[t]?.label).join(' / '), RE_WANT[c.want_purpose] || ''].filter(Boolean).join(' — '), c.budget_min, c.budget_max, (c.want_areas || []).join('، '),
      memberById(c.agent_id)?.full_name || '', c.first_contact, c.last_contact_at ? String(c.last_contact_at).slice(0, 10) : '', c.next_followup, c.notes]);
  }
  downloadFile(`masar-clients-${todayISO()}.csv`, toCSV(rows), 'text/csv;charset=utf-8');
  toast('تم تصدير العملاء');
}

function ReLogForm({ c }) {
  const [type, setType] = useState('note');
  const [body, setBody] = useState('');
  const [follow, setFollow] = useState('');
  const [when, setWhen] = useState(todayISO());
  const [busy, run] = useBusy();
  const save = () => run(async () => {
    if (!body.trim() && type === 'note') { toast('اكتب الملاحظة أولاً', 'bad'); return; }
    const happened = when === todayISO() ? new Date().toISOString() : new Date(when + 'T10:00:00').toISOString();
    await reLog({ client_id: c.id, type, body: body.trim() || null, happened_at: happened });
    const patch = {};
    if (['call', 'whatsapp', 'meeting', 'email'].includes(type)) patch.last_contact_at = happened;
    if (follow) patch.next_followup = addDays(todayISO(), Number(follow));
    if (Object.keys(patch).length) await reSave('re_clients', patch, c.id);
    setBody(''); setFollow(''); setWhen(todayISO());
    toast('تم التسجيل');
  });
  return html`<div style="margin-bottom:6px">
    <div class="log-types">${RE_LOG_TYPES.map((t) => html`<button class=${'chip' + (type === t ? ' on' : '')} onClick=${() => setType(t)}><${Icon} n=${RE_ACT[t].icon} /> ${RE_ACT[t].label}</button>`)}</div>
    <textarea class="textarea" style="min-height:70px" placeholder=${type === 'call' ? 'ملخص الاتصال: ماذا طلب؟ ما ردّه؟' : 'اكتب ملاحظة...'} value=${body} onInput=${(e) => setBody(e.target.value)}></textarea>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap">
      <select class="select" style="flex:1;min-width:140px" value=${follow} onChange=${(e) => setFollow(e.target.value)} aria-label="موعد المتابعة">
        <option value="">موعد المتابعة كما هو</option><option value="1">متابعة غداً</option><option value="2">بعد يومين</option><option value="3">بعد 3 أيام</option><option value="7">بعد أسبوع</option><option value="14">بعد أسبوعين</option><option value="30">بعد شهر</option>
      </select>
      <input class="input" type="date" value=${when} max=${todayISO()} onChange=${(e) => setWhen(e.target.value || todayISO())} style="width:auto" aria-label="التاريخ" />

  </div>`;
}

/* ---------- إرسال العقارات للعميل عبر واتساب (مع صفحة الصور) ---------- */
const accPropsTx = (n) => (n === 1 ? 'عقاراً واحداً' : n === 2 ? 'عقارين' : n <= 10 ? `${n} عقارات` : `${n} عقاراً`);
function shareMessage(c, props, token) {
  const st = S().reSettings || {};
  const me = S().me || {};
  const lines = props.map((p, i) => {
    const specs = specList(p).map((x) => x.t).join(' · ');
    return `${i + 1}) *${propName(p)}* — ${propPlace(p) || RE_PURPOSE[p.purpose]?.label || ''}\n   ${priceTx(p)}${specs ? ` · ${specs}` : ''}`;
  }).join('\n');
  const map = {
    'العميل': firstName(c?.name) || '', 'المرسل': me.full_name || '', 'هاتف_المرسل': me.phone || st.whatsapp || st.phone || '',
    'المكتب': st.brand_name || 'مكتب الطيب — الوساطة العقارية', 'العدد': accPropsTx(props.length), 'العقارات': lines, 'الرابط': shareLink(token),
  };
  return String(st.share_template || RE_DEFAULT_SHARE).replace(/\{([^{}\n]{1,20})\}/g, (m, k) => (k.trim() in map ? map[k.trim()] : m))
    .replace(/[ \t]+$/gm, '').replace(/\n{3,}/g, '\n\n').trim();
}

function ReSendSheet({ clientId, propIds, onClose }) {
  const s = useS();
  const [cid, setCid] = useState(clientId || '');
  const c = clientById(cid);
  const [ids, setIds] = useState(propIds || []);
  const props = ids.map(propById).filter(Boolean);
  const [token, setToken] = useState(newShareToken);
  const [text, setText] = useState('');
  const [phone, setPhone] = useState('');
  const [advance, setAdvance] = useState(true);
  const [savedFor, setSavedFor] = useState(null);   // الرابط محفوظ لهذا العميل وهذه العقارات
  const [busy, run] = useBusy();
  const fd = Number(s.reSettings?.followup_days || 2);
  const key = `${cid}|${ids.join(',')}`;
  // تغيّر العميل أو العقارات بعد حفظ الرابط (معاينة) ← رابط جديد حتى لا يرى العميل قائمة غيره
  useEffect(() => { if (savedFor && savedFor !== key) { setToken(newShareToken()); setSavedFor(null); } }, [key]);
  useEffect(() => { if (c) { setText(shareMessage(c, props, token)); setPhone(c.whatsapp || c.phone || ''); } }, [key, token]);
  const candidates = useMemo(() => {
    const list = s.reClients.filter((x) => x.status === 'active');
    if (!props.length) return list;
    return list.map((x) => ({ x, sc: hasRequest(x) ? Math.max(0, ...props.map((p) => matchProperty(x, p, { anyStatus: true })?.score || 0)) : 0 }))
      .sort((a, b) => b.sc - a.sc).map((y) => ({ ...y.x, _score: y.sc }));
  }, [ids.join(','), s.reClients]);
  const ensureShare = async () => {
    if (DEMO || savedFor === key) return;
    await q(sb.from('re_shares').insert({ token, client_id: c?.id || null, property_ids: ids }));
    setSavedFor(key);
  };
  const record = (channel) => run(async () => {
    await ensureShare();
    for (const p of props) { const ex = reCPOf(c.id, p.id); if (!ex || ex.status === 'suggested') await reSetCP(c.id, p.id, 'sent'); }
    await reLog({ client_id: c.id, type: 'sent', body: text, meta: { property_ids: ids, channel, token } });
    await reTouchClient(c, advance ? { next_followup: addDays(todayISO(), fd) } : {});
    toast(`سُجّل إرسال ${propsTx(props.length)} إلى ${firstName(c.name)} ✓`);
    onClose();
  });
  const sendWa = () => {
    if (!c) { toast('اختر العميل أولاً', 'bad'); return; }
    if (!props.length) { toast('لا توجد عقارات محددة', 'bad'); return; }
    window.open(waLink(phone, text), '_blank', 'noopener');
    record('whatsapp');
  };
  const preview = async () => {
    if (DEMO) { toast('صفحة العقارات للعميل تعمل بعد رفع النظام على Vercel'); return; }
    const w = window.open('about:blank', '_blank');
    try { await ensureShare(); const u = `${publicBase()}/r/${token}?preview=1`; if (w) w.location.href = u; else location.href = u; } catch (e) { if (w) w.close(); fail(e); }
  };
  const foot = html`<button class="btn" onClick=${onClose}>إلغاء</button><button class="btn wa" onClick=${sendWa} disabled=${busy || !c || !props.length}>${busy ? html`<${Spinner} />` : html`<${Icon} n="wa" />`} واتساب</button>`;
  return html`<${Sheet} title=${c ? `إرسال عقارات — ${c.name}` : 'إرسال عقارات لعميل'} onClose=${onClose} foot=${foot}>
    ${clientId ? null : html`<${Field} label="العميل">
      <select class="select" value=${cid} onChange=${(e) => setCid(e.target.value)}>
        <option value="">اختر العميل...</option>
        ${candidates.map((x) => html`<option value=${x.id}>${x.name}${x._score >= 50 ? ` — مطابقة ${x._score}%` : ''}</option>`)}
      </select></${Field}>`}
    <div class="sel-props">${props.map((p) => html`<span class="feat" key=${p.id}>${propName(p)}${props.length > 1 ? html` <button class="x" aria-label="إزالة" onClick=${() => setIds(ids.filter((i) => i !== p.id))}>×</button>` : null}</span>`)}</div>
    ${c ? html`
      <${Field} label="واتساب العميل"><input class="input num" type="tel" value=${phone} onInput=${(e) => setPhone(e.target.value)} placeholder="بدون رقم: اختر من واتساب" /></${Field}>

/* ---------- المعاينة: حجز وتسجيل النتيجة ---------- */
function ViewingForm({ id, clientId, propertyId, onClose }) {
  const s = useS();
  const ex = id ? s.reViewings.find((v) => v.id === id) : null;
  const [cid, setCid] = useState(ex?.client_id || clientId || '');
  const [pid, setPid] = useState(ex?.property_id || propertyId || '');
  const d0 = ex ? new Date(ex.at) : null;
  const [date, setDate] = useState(ex ? isoOf(d0) : addDays(todayISO(), 1));
  const [time, setTime] = useState(ex ? `${pad(d0.getHours())}:${pad(d0.getMinutes())}` : '17:00');
  const [notes, setNotes] = useState(ex?.notes || '');
  const [reason, setReason] = useState('');
  const [busy, run] = useBusy();
  const c = clientById(cid); const p = propById(pid);
  const clientProps = c ? s.reCP.filter((x) => x.client_id === c.id && x.status !== 'rejected').map((x) => propById(x.property_id)).filter(Boolean) : [];
  const others = s.reProps.filter((x) => !clientProps.includes(x) && ['available', 'reserved'].includes(x.status));
  const at = () => new Date(`${date}T${time || '17:00'}:00`).toISOString();
  const create = () => run(async () => {
    if (!c || !p) { toast('اختر العميل والعقار', 'bad'); return; }
    const row = await reSave('re_viewings', { client_id: c.id, property_id: p.id, at: at(), notes: notes.trim() || null, agent_id: S().me?.id || null });
    await reSetCP(c.id, p.id, 'viewing');
    await reLog({ client_id: c.id, property_id: p.id, type: 'viewing', body: `موعد معاينة: ${fmtDate(row.at)} — ${fmtTime(row.at)}${notes.trim() ? `\n${notes.trim()}` : ''}` });
    await reTouchClient(c, { next_followup: date < todayISO() ? todayISO() : date });
    toast('تم حجز المعاينة 📅'); onClose();
  });
  const saveTime = () => run(async () => { await reSave('re_viewings', { at: at(), notes: notes.trim() || null }, ex.id); toast('تم تعديل الموعد'); onClose(); });
  const finish = (status, result) => run(async () => {
    await reSave('re_viewings', { status, result: result || null, notes: notes.trim() || null }, ex.id);
    if (status === 'done') {
      await reSetCP(c.id, p.id, result === 'rejected' ? 'rejected' : 'viewed', result === 'rejected' ? { reason: reason || null } : {});
      await reLog({ client_id: c.id, property_id: p.id, type: 'viewed', body: `تمت المعاينة — ${{ liked: 'أعجبه 👍', rejected: `لم يعجبه 👎${reason ? ` (${reason})` : ''}`, thinking: 'يفكر 🤔' }[result]}${notes.trim() ? `\n${notes.trim()}` : ''}` });
      await reTouchClient(c, { next_followup: addDays(todayISO(), result === 'rejected' ? 2 : 1) });
    } else {
      await reLog({ client_id: c.id, property_id: p.id, type: 'viewing', body: status === 'cancelled' ? 'أُلغيت المعاينة' : 'لم يحضر العميل للمعاينة' });
    }
    toast('تم التسجيل'); onClose();
  });
  const remind = () => {
    if (!c || !p) return;
    const t = `مرحباً ${firstName(c.name)} 👋\nتذكير بموعد معاينة *${propName(p)}*${p.area ? ` في ${p.area}` : ''}\n📅 ${fmtDate(at())} — ${fmtTime(at())}${p.map_url ? `\n📍 الموقع: ${p.map_url}` : ''}\n\n${S().me?.full_name || ''}`;
    window.open(waLink(c.whatsapp || c.phone, t), '_blank', 'noopener');
  };
  const foot = ex
    ? html`<button class="btn" onClick=${onClose}>إغلاق</button>${ex.status === 'scheduled' ? html`<button class="btn primary" onClick=${saveTime} disabled=${busy}>حفظ الموعد</button>` : null}`
    : html`<button class="btn" onClick=${onClose}>إلغاء</button><button class="btn primary" onClick=${create} disabled=${busy}>${busy ? html`<${Spinner} />` : html`<${Icon} n="calendar" />`} حجز المعاينة</button>`;
  return html`<${Sheet} title=${ex ? 'المعاينة' : 'حجز معاينة'} onClose=${onClose} foot=${foot}>
    ${ex ? html`<div class="kv"><span>العميل</span><b><a href=${'#/client/' + c?.id} onClick=${onClose}>${c?.name || '—'}</a></b></div>
        <div class="kv"><span>العقار</span><b><a href=${'#/prop/' + p?.id} onClick=${onClose}>${propName(p)}</a></b></div>
        <div class="kv"><span>الحالة</span><b>${{ scheduled: 'مجدولة', done: 'تمت', cancelled: 'ألغيت', no_show: 'لم يحضر' }[ex.status]}${ex.result ? ` — ${{ liked: 'أعجبه', rejected: 'لم يعجبه', thinking: 'يفكر' }[ex.result]}` : ''}</b></div>
        <div class="divider"></div>`
      : html`
        ${clientId ? html`<div class="kv"><span>العميل</span><b>${c?.name}</b></div>` : html`<${Field} label="العميل"><select class="select" value=${cid} onChange=${(e) => setCid(e.target.value)}><option value="">اختر...</option>${s.reClients.filter((x) => x.status === 'active').map((x) => html`<option value=${x.id}>${x.name}</option>`)}</select></${Field}>`}
        ${propertyId ? html`<div class="kv"><span>العقار</span><b>${propName(p)}</b></div>` : html`<${Field} label="العقار"><select class="select" value=${pid} onChange=${(e) => setPid(e.target.value)}>
          <option value="">اختر...</option>
          ${clientProps.length ? html`<optgroup label="أُرسلت للعميل">${clientProps.map((x) => html`<option value=${x.id}>${propName(x)} — ${x.area || ''}</option>`)}</optgroup>` : null}
          <optgroup label="عقارات متاحة">${others.map((x) => html`<option value=${x.id}>${propName(x)} — ${x.area || ''}</option>`)}</optgroup>
        </select></${Field}>`}`}
    ${!ex || ex.status === 'scheduled' ? html`<div class="row2">
      <${Field} label="التاريخ"><input class="input" type="date" value=${date} onInput=${(e) => setDate(e.target.value)} /></${Field}>
      <${Field} label="الوقت"><input class="input num" type="time" value=${time} onInput=${(e) => setTime(e.target.value)} /></${Field}>
    </div>` : null}
    <${Field} label="ملاحظات"><input class="input" value=${notes} onInput=${(e) => setNotes(e.target.value)} placeholder="مثال: يحضر مع زوجته، يسأل عن المدارس..." /></${Field}>
    ${ex && ex.status === 'scheduled' ? html`
      <button class="btn block" style="margin-bottom:10px" onClick=${remind}><${Icon} n="wa" /> تذكير العميل بالموعد عبر واتساب</button>
      <div class="section-label" style="margin-top:4px">بعد المعاينة: ماذا كان رأيه؟</div>
      <div class="actions">
        <button class="btn" onClick=${() => finish('done', 'liked')} disabled=${busy}>👍 أعجبه</button>
        <button class="btn" onClick=${() => finish('done', 'thinking')} disabled=${busy}>🤔 يفكر</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <select class="select" style="flex:1" value=${reason} onChange=${(e) => setReason(e.target.value)} aria-label="سبب الرفض"><option value="">سبب الرفض (اختياري)</option>${RE_REJECT.map((r) => html`<option>${r}</option>`)}</select>
        <button class="btn danger" onClick=${() => finish('done', 'rejected')} disabled=${busy}>👎 لم يعجبه</button>
      </div>
      <div class="btn-row" style="margin-top:12px;justify-content:center">
        <button class="btn sm ghost" onClick=${() => finish('no_show')} disabled=${busy}>لم يحضر</button>
        <button class="btn sm ghost" onClick=${() => finish('cancelled')} disabled=${busy}>إلغاء المعاينة</button>
      </div>` : null}
  </${Sheet}>`;
}

    <div class="end"><b class="num" style="font-size:14px">${fmtBD(d.price)}</b><span class="pill" style=${`--c:${st.c}`}>${st.label}</span></div>
  </button>`;
}

function Deals() {
  const s = useS();
  const admin = isAdmin();
  const me = s.me || {};
  const [status, setStatus] = useState('all');
  const [month, setMonth] = useState(todayISO().slice(0, 7));
  const months = [...new Set([todayISO().slice(0, 7), ...s.reDeals.map((d) => String(d.deal_date).slice(0, 7))])].sort().reverse();
  const inMonth = s.reDeals.filter((d) => month === 'all' || String(d.deal_date).slice(0, 7) === month);
  const done = inMonth.filter((d) => d.status === 'completed');
  const sum = (arr, k) => arr.reduce((a, d) => a + Number(d[k] || 0), 0);
  const list = inMonth.filter((d) => status === 'all' || d.status === status);
  const agents = {};
  for (const d of done) { const k = d.agent_id || '-'; (agents[k] ||= { n: 0, comm: 0, share: 0, unpaid: 0 }); agents[k].n++; agents[k].comm += Number(d.commission || 0); agents[k].share += Number(d.agent_amount || 0); if (!d.agent_paid) agents[k].unpaid += Number(d.agent_amount || 0); }
  const myUnpaid = s.reDeals.filter((d) => d.status === 'completed' && d.agent_id === me.id && !d.agent_paid).reduce((a, d) => a + Number(d.agent_amount || 0), 0);
  const monthLabel = (m) => (m === 'all' ? 'كل الفترات' : fmtDate(m + '-15', { month: 'long', year: 'numeric' }));
  return html`<div class="page">
    <${PageHead} title="الصفقات والعمولات"><button class="btn sm gold" onClick=${() => openModal('deal', {})}><${Icon} n="plus" /> صفقة</button></${PageHead}>
    <div class="toolbar">
      <select class="select" style="width:auto;border-radius:999px" value=${month} onChange=${(e) => setMonth(e.target.value)} aria-label="الفترة">
        ${months.map((m) => html`<option value=${m}>${monthLabel(m)}</option>`)}<option value="all">كل الفترات</option>
      </select>
    </div>
    <div class="grid two" style="margin-bottom:12px">
      <section class="card money-card">
        <div class="card-title"><${Icon} n="coins" /> ${monthLabel(month)} — الصفقات المكتملة</div>
        <div class="big num">${fmtBD(sum(done.filter((d) => d.kind === 'sale'), 'price'))} <span style="font-size:15px">د.ب مبيعات</span></div>
        <div class="flow">
          <div><span>العمولات</span><b class="num">${fmtBD(sum(done, 'commission'))}</b></div><i>←</i>
          <div><span>نصيب الموظفين</span><b class="num">${fmtBD(sum(done, 'agent_amount'))}</b></div><i>←</i>
          <div><span>ربح المكتب</span><b class="num">${fmtBD(sum(done, 'office_amount'))}</b></div>
        </div>
        <div class="muted small" style="margin-top:6px">${done.length ? `${done.length} ${done.length === 1 ? 'صفقة مكتملة' : 'صفقات مكتملة'}` : 'لا صفقات مكتملة في هذه الفترة'}${done.some((d) => d.kind === 'rent') ? ` · إيجارات ${fmtBD(round3(done.filter((d) => d.kind === 'rent').reduce((a, d) => a + Number(d.price || 0) / (d.price_period === 'year' ? 12 : 1), 0)))} د.ب شهرياً` : ''}</div>
      </section>
      <section class="card">
        <div class="card-title"><${Icon} n="users" /> ${admin ? 'عمولات الموظفين' : 'عمولتي'}</div>
        ${Object.keys(agents).filter((k) => admin || k === me.id).length ? Object.entries(agents).filter(([k]) => admin || k === me.id).sort((a, b) => b[1].comm - a[1].comm).map(([k, v], i) => html`<div class="kv" key=${k}>
            <span>${admin && i === 0 ? '🏆 ' : ''}${k === '-' ? 'بدون موظف' : memberById(k)?.full_name || '—'} · <span class="num">${v.n}</span></span>
            <b class="num">${fmtBD(v.share)} د.ب${v.unpaid ? html` <small class="muted">(${fmtBD(v.unpaid)} لم تُصرف)</small>` : ''}</b></div>`)
          : html`<div class="muted small">${admin ? 'تظهر هنا عمولة كل موظف من الصفقات المكتملة.' : 'تظهر هنا عمولتك من الصفقات المكتملة.'}</div>`}
        ${!admin && myUnpaid ? html`<div class="views" style="margin-top:10px"><${Icon} n="coins" /><span>عمولتك المستحقة (لم تُصرف بعد): <b class="num">${fmtBD(myUnpaid)} د.ب</b></span></div>` : null}
      </section>
    </div>
    <div class="chips">${[['all', 'الكل'], ...Object.entries(RE_DEAL_STATUS).map(([k, v]) => [k, v.label])].map(([k, l]) => html`<button class=${'chip' + (status === k ? ' on' : '')} onClick=${() => setStatus(k)}>${k !== 'all' ? html`<span class="dot" style=${`--c:${RE_DEAL_STATUS[k].c}`}></span>` : null}${l}</button>`)}</div>
    ${list.length ? html`<div class="list" style="padding:0 14px">${list.map((d) => html`<${DealRow} d=${d} key=${d.id} />`)}</div>`
      : html`<div class="card"><${Empty} icon="deal" title="لا توجد صفقات">${s.reDeals.length ? 'جرّب فترة أو حالة أخرى.' : 'سجّل الصفقة عند الاتفاق — ويحسب النظام العمولة ونصيب الموظف وربح المكتب تلقائياً.'}</${Empty}></div>`}
  </div>`;
}

function DealForm({ id, propertyId, clientId, onClose }) {
  const s = useS();
  const admin = isAdmin();
  const ex = id ? s.reDeals.find((d) => d.id === id) : null;
  const p0 = propById(ex?.property_id || propertyId);
  const st = s.reSettings || {};
  const [f, setF] = useState(() => {
    if (ex) return { property_id: ex.property_id || '', client_id: ex.client_id || '', owner_id: ex.owner_id || '', agent_id: ex.agent_id || '', kind: ex.kind, period: ex.price_period || null, price: ex.price, mode: 'amount', pct: '', commission: ex.commission,
      agent_pct: ex.agent_pct, deal_date: ex.deal_date, payment_method: ex.payment_method || null, status: ex.status, commission_received: ex.commission_received, agent_paid: ex.agent_paid, notes: ex.notes || '' };
    const kind = p0?.purpose === 'rent' ? 'rent' : 'sale';
    const agent = p0?.agent_id || s.me?.id || '';
    return { property_id: p0?.id || '', client_id: clientId || '', owner_id: p0?.owner_id || '', agent_id: agent, kind, period: kind === 'rent' ? p0?.price_period || 'month' : null, price: p0?.price ?? '', mode: kind === 'rent' ? 'months' : 'pct',
      pct: kind === 'rent' ? Number(st.rent_commission_months ?? 1) : Number(st.sale_commission_pct ?? 2), commission: '', agent_pct: defaultAgentPct(agent), deal_date: todayISO(),
      payment_method: null, status: 'negotiation', commission_received: false, agent_paid: false, notes: '' };
  });
  const [busy, run] = useBusy();
  const price = numOrNull(f.price) || 0;
  const yearly = f.kind === 'rent' && f.period === 'year';
  const monthly = yearly ? price / 12 : price;   // عمولة «أشهر إيجار» = الإيجار الشهري × عدد الأشهر
  const commission = round3(f.mode === 'pct' ? (price * (numOrNull(f.pct) || 0)) / 100 : f.mode === 'months' ? monthly * (numOrNull(f.pct) || 0) : numOrNull(f.commission) || 0);
  const agentPct = admin ? numOrNull(f.agent_pct) ?? 0 : ex && f.agent_id === (ex.agent_id || '') ? Number(ex.agent_pct) : defaultAgentPct(f.agent_id);
  // الصفقة المكتملة أو المصروفة عمولتها: الموظف يعدّل الملاحظات واستلام العمولة فقط
  const locked = !admin && ex && (ex.status === 'completed' || ex.agent_paid);
  const agentAmt = round3((commission * agentPct) / 100);
  const officeAmt = round3(commission - agentAmt);
  const pickProp = (pid) => {
    const p = propById(pid);
    if (!p) { setF({ ...f, property_id: '' }); return; }
    const kind = p.purpose === 'rent' ? 'rent' : 'sale';
    const agent = p.agent_id || f.agent_id;
    setF({ ...f, property_id: pid, owner_id: p.owner_id || '', kind, period: kind === 'rent' ? p.price_period || 'month' : null, price: p.price ?? f.price, agent_id: agent, agent_pct: admin ? f.agent_pct : defaultAgentPct(agent),
      ...(ex ? {} : { mode: kind === 'rent' ? 'months' : 'pct', pct: kind === 'rent' ? Number(st.rent_commission_months ?? 1) : Number(st.sale_commission_pct ?? 2) }) });
  };
  const save = () => run(async () => {
    if (!(price >= 0) || f.price === '') { toast('أدخل سعر الصفقة', 'bad'); return; }
    const p = propById(f.property_id); const c = clientById(f.client_id);
    if (locked) {
      await reSave('re_deals', { notes: String(f.notes || '').trim() || null, commission_received: Boolean(f.commission_received) }, ex.id);
      toast('تم حفظ الصفقة'); onClose(); return;
    }
    const data = { property_id: f.property_id || null, client_id: f.client_id || null, owner_id: f.owner_id || null, agent_id: f.agent_id || null, kind: f.kind,
      price_period: f.kind === 'rent' ? f.period || null : null, title: p ? propName(p) : ex?.title || null, price, commission, deal_date: f.deal_date || todayISO(), payment_method: f.payment_method || null, status: f.status,
      commission_received: Boolean(f.commission_received), notes: String(f.notes || '').trim() || null };
    if (admin) { data.agent_pct = agentPct; data.agent_paid = Boolean(f.agent_paid); data.agent_paid_on = f.agent_paid ? ex?.agent_paid_on || todayISO() : null; }
    const row = await reSave('re_deals', data, ex?.id);
    const changed = !ex || ex.status !== row.status;
    if (changed) {
      const label = RE_DEAL_STATUS[row.status].label;
      const body = `${ex ? `الصفقة: ${label}` : `صفقة جديدة (${label})`} — ${fmtBD(row.price)} د.ب · العمولة ${fmtBD(row.commission)} د.ب`;
      if (c) await reLog({ client_id: c.id, property_id: p?.id || null, deal_id: row.id, type: 'deal', body });
      else if (p) await reLog({ property_id: p.id, deal_id: row.id, type: 'deal', body });
      if (p) {
        if (row.status === 'reserved' && p.status === 'available') await reSetPropStatus(p, 'reserved');
        if (row.status === 'completed') await reSetPropStatus(p, row.kind === 'rent' ? 'rented' : 'sold');
        if (row.status === 'cancelled' && p.status === 'reserved') await reSetPropStatus(p, 'available');
      }
      if (c && p && ['reserved', 'completed'].includes(row.status)) await reSetCP(c.id, p.id, 'offer');
      if (c && row.status === 'completed' && c.status !== 'won') await reSave('re_clients', { status: 'won', next_followup: null }, c.id);
      if (row.status === 'completed') { confetti(); toast('مبروك! صفقة مكتملة 🎉'); }
    }
    if (!changed || row.status !== 'completed') toast(ex ? 'تم حفظ الصفقة' : 'تم تسجيل الصفقة ✓');
    onClose();
  });
  const del = () => run(async () => { if (!confirm('حذف هذه الصفقة؟')) return; await reRemove('re_deals', ex.id); toast('تم حذف الصفقة'); onClose(); });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const foot = html`${ex && admin ? html`<button class="btn danger" style="flex:0 0 auto" onClick=${del} disabled=${busy}><${Icon} n="trash" /></button>` : null}
    <button class="btn" onClick=${onClose}>إلغاء</button><button class="btn primary" onClick=${save} disabled=${busy}>${busy ? html`<${Spinner} />` : html`<${Icon} n="check" />`} ${ex ? 'حفظ' : 'تسجيل الصفقة'}</button>`;
  return html`<${Sheet} title=${ex ? 'الصفقة' : 'صفقة جديدة'} onClose=${onClose} foot=${foot}>
    ${locked ? html`<div class="views" style="margin-bottom:12px"><${Icon} n="lock" /><span>الصفقة ${ex.status === 'completed' ? 'مكتملة' : 'صُرفت عمولتها'} — يمكنك تعديل الملاحظات واستلام العمولة فقط، وباقي التعديل للمدير.</span></div>` : null}
    <fieldset class="bare" disabled=${locked}>
    <${Field} label="العقار"><select class="select" value=${f.property_id} onChange=${(e) => pickProp(e.target.value)}>
      <option value="">—</option>${s.reProps.map((p) => html`<option value=${p.id}>${propName(p)}${p.area ? ` — ${p.area}` : ''} (${RE_STATUS[p.status]?.label})</option>`)}</select></${Field}>
    <div class="row2">
      <${Field} label="العميل"><select class="select" value=${f.client_id} onChange=${set('client_id')}><option value="">—</option>${s.reClients.map((c) => html`<option value=${c.id}>${c.name}</option>`)}</select></${Field}>
      <${Field} label="المالك"><select class="select" value=${f.owner_id} onChange=${set('owner_id')}><option value="">—</option>${s.reOwners.map((o) => html`<option value=${o.id}>${o.name}</option>`)}</select></${Field}>
    </div>
    <div class="row2">
      <${Field} label="الموظف"><${MemberSelect} value=${f.agent_id} empty="—" onChange=${(v) => setF({ ...f, agent_id: v || '', agent_pct: admin && !ex ? defaultAgentPct(v) : f.agent_pct })} /></${Field}>
      <${Group} label="نوع الصفقة"><${ChipPick} options=${[['sale', 'بيع'], ['rent', 'إيجار']]} value=${f.kind} allowEmpty=${false} onChange=${(v) => setF({ ...f, kind: v, period: v === 'rent' ? f.period || 'month' : null, ...(ex ? {} : { mode: v === 'rent' ? 'months' : 'pct', pct: v === 'rent' ? Number(st.rent_commission_months ?? 1) : Number(st.sale_commission_pct ?? 2) }) })} /></${Group}>
    </div>
    ${f.kind === 'rent' ? html`<div class="seg" style="margin-bottom:8px">${[['month', 'إيجار شهري'], ['year', 'إيجار سنوي']].map(([k, l]) => html`<button type="button" class=${(f.period || 'month') === k ? 'on' : ''} onClick=${() => setF({ ...f, period: k })}>${l}</button>`)}</div>` : null}
    <${Field} label=${f.kind === 'rent' ? (yearly ? 'قيمة الإيجار السنوي (د.ب)' : 'قيمة الإيجار الشهري (د.ب)') : 'سعر البيع (د.ب)'}><input class="input num" inputmode="decimal" value=${f.price} onInput=${set('price')} /></${Field}>
    <${Group} label="العمولة">
      <div class="seg" style="margin-bottom:8px">${[['pct', 'نسبة %'], ...(f.kind === 'rent' ? [['months', 'أشهر إيجار']] : []), ['amount', 'مبلغ']].map(([k, l]) => html`<button type="button" class=${f.mode === k ? 'on' : ''} onClick=${() => setF({ ...f, mode: k, commission: k === 'amount' ? commission : f.commission })}>${l}</button>`)}</div>
      ${f.mode === 'amount' ? html`<input class="input num" inputmode="decimal" value=${f.commission} onInput=${set('commission')} placeholder="مبلغ العمولة" />`
        : html`<input class="input num" inputmode="decimal" value=${f.pct} onInput=${set('pct')} placeholder=${f.mode === 'pct' ? '2' : '1'} />`}
      ${f.mode === 'months' && yearly ? html`<div class="hint">الإيجار الشهري: <span class="num">${fmtBD(round3(monthly))}</span> د.ب × عدد الأشهر</div>` : null}
    </${Group}>
    ${admin ? html`<${Field} label="نسبة الموظف من العمولة %"><input class="input num" inputmode="decimal" value=${f.agent_pct} onInput=${set('agent_pct')} /></${Field}>` : null}
    <div class="calc">
      <div><span>سعر الصفقة</span><b class="num">${fmtBD(price)}</b></div><i>←</i>
      <div><span>العمولة</span><b class="num">${fmtBD(commission)}</b></div><i>←</i>
      <div><span>الموظف ${agentPct}%</span><b class="num">${fmtBD(agentAmt)}</b></div><i>←</i>
      <div class="hl"><span>ربح المكتب</span><b class="num">${fmtBD(officeAmt)}</b></div>
    </div>
    <div class="row2" style="margin-top:12px">
      <${Field} label="تاريخ الصفقة"><input class="input" type="date" value=${f.deal_date} onInput=${set('deal_date')} /></${Field}>
      <${Field} label="طريقة الدفع"><select class="select" value=${f.payment_method || ''} onChange=${(e) => setF({ ...f, payment_method: e.target.value || null })}><option value="">—</option>${Object.entries(RE_PAY).map(([k, v]) => html`<option value=${k}>${v}</option>`)}</select></${Field}>
    </div>
    <${Group} label="حالة الصفقة"><${ChipPick} options=${Object.entries(RE_DEAL_STATUS).map(([k, v]) => [k, v.label])} value=${f.status} allowEmpty=${false} onChange=${(v) => setF({ ...f, status: v })} /></${Group}>
    <div class="hint" style="margin:-4px 0 8px">«محجوز» يحجز العقار، و«مكتملة» تجعله مباعاً/مؤجراً وتنقل العميل إلى «تمت الصفقة».</div>
    </fieldset>
    <label class="check"><input type="checkbox" checked=${f.commission_received} onChange=${(e) => setF({ ...f, commission_received: e.target.checked })} /><span>استلم المكتب العمولة</span></label>
    ${admin ? html`<label class="check"><input type="checkbox" checked=${f.agent_paid} onChange=${(e) => setF({ ...f, agent_paid: e.target.checked })} /><span>صُرف نصيب الموظف${ex?.agent_paid_on ? ` (${fmtShort(ex.agent_paid_on)})` : ''}</span></label>`
      : html`<div class="hint">نسبة الموظف وصرف عمولته يحددها المدير.${ex ? ` — ${ex.agent_paid ? 'تم صرف نصيبك ✓' : 'لم يُصرف نصيبك بعد'}` : ''}</div>`}
    <${Field} label="ملاحظات"><input class="input" value=${f.notes} onInput=${set('notes')} /></${Field}>
  </${Sheet}>`;
}

/* =====================================================================

const EMPTY_REQ = { want_types: [], want_purpose: null, budget_min: '', budget_max: '', want_areas: [], min_bedrooms: null, min_bathrooms: null, min_parking: null, min_area: '', want_furnished: null, want_features: [] };
function MatchSearch() {
  useS();
  const [f, setF0] = useState(() => ({ ...EMPTY_REQ, ...lsGet('masar-match', {}) }));
  const [sel, setSel] = useState([]);
  const setF = (v) => { setF0(v); lsSet('masar-match', v); };
  const req = requestPatch(f);
  const any = hasRequest(req);
  const results = any ? matchesFor(req, { min: 40 }) : [];
  const toggle = (id) => setSel(sel.includes(id) ? sel.filter((x) => x !== id) : [...sel, id]);
  return html`<div class="page">
    <${PageHead} title="ابحث عن عقار لعميل" sub="حدد ما يريده العميل، ويرتّب النظام العقارات المتاحة بنسبة المطابقة." />
    <div class="grid two" style="align-items:start">
      <section class="card">
        <${AreasDatalist} />
        <${RequestFields} f=${f} setF=${setF} />

          <button class="btn sm" onClick=${() => { setF({ ...EMPTY_REQ }); setSel([]); }}><${Icon} n="refresh" /> مسح</button>

        </div>
      </section>
      <section class="card">
        <div class="card-title"><${Icon} n="spark" /> النتائج<span class="grow"></span>${any ? html`<span class="muted small num">${results.length}</span>` : null}</div>
        ${!any ? html`<${Empty} icon="search" title="ابدأ بالاختيار">النوع، الغرض، الميزانية، المنطقة، أو عدد الغرف.</${Empty}>`
          : results.length ? results.slice(0, 40).map(({ p, m }) => html`<div class="mrow" key=${p.id}>
              <label class="mcheck"><input type="checkbox" checked=${sel.includes(p.id)} onChange=${() => toggle(p.id)} aria-label=${`اختيار ${propName(p)}`} /></label>
              <button class="pthumb" onClick=${() => go('prop/' + p.id)} aria-label=${propName(p)}><${PropThumb} p=${p} /></button>
              <div class="main-col" onClick=${() => go('prop/' + p.id)} style="cursor:pointer">
                <div class="t"><span>${propName(p)}</span></div>
                <div class="s"><span class="num">${priceTx(p)}</span>${p.area ? ` · ${p.area}` : ''}${p.bedrooms != null ? ` · ${roomsTx(p.bedrooms)}` : ''}</div>
                <${Why} parts=${m.parts.slice(0, 4)} />
              </div>
              <${MatchBadge} score=${m.score} />
            </div>`)
          : html`<${Empty} icon="search" title="لا توجد عقارات متاحة مطابقة">جرّب توسيع الميزانية أو إضافة مناطق.</${Empty}>`}
        ${sel.length ? html`<div class="selbar"><span style="flex:1">${propsTx(sel.length)} محددة</span>
          <button class="btn sm wa" onClick=${() => { openModal('resend', { propIds: sel }); setSel([]); }}><${Icon} n="wa" /> أرسل لعميل</button></div>` : null}
      </section>
    </div>
  </div>`;
}

/* =====================================================================

function ReMore() {
  const items = [
    { k: 'owners', label: 'الملاك', icon: 'key', sub: 'ملف كل مالك وعقاراته واتفاقه' },
    { k: 'deals', label: 'الصفقات والعمولات', icon: 'coins', sub: 'سعر الصفقة ← العمولة ← نصيب الموظف ← ربح المكتب' },
    { k: 'match', label: 'ابحث عن عقار لعميل', icon: 'spark', sub: 'مطابقة الطلب مع العقارات بالنسبة المئوية' },
    { k: 'settings', label: 'الإعدادات', icon: 'sliders', sub: 'بياناتي، الرقم السري، المظهر' },
  ];

function Settings() {
  const s = useS();
  const me = s.me || {};
  const admin = isAdmin();
  const [prof, setProf] = useState({ full_name: me.full_name || '', name_en: me.name_en || '', title_ar: me.title_ar || '', title_en: me.title_en || '', phone: me.phone || '' });
  const [firm, setFirm] = useState(() => ({ ...(s.settings || {}) }));
  const [pw, setPw] = useState({ a: '', b: '' });
  const [theme, setTheme] = useState(lsGet('masar-theme', 'auto'));
  const [status, setStatus] = useState(null);
  const [busy, run] = useBusy();
  useEffect(() => { setFirm({ ...(s.settings || {}) }); }, [s.settings?.updated_at]);
  useEffect(() => {
    if (!admin) return;
    if (DEMO) { setStatus({ demo: true, schema: true, serviceKey: true, smtp: false, dbUrl: false }); return; }
    fetch('/api/admin?action=status').then((r) => r.json()).then(setStatus).catch(() => setStatus({ error: true }));
  }, []);

  const saveProf = () => run(async () => {
    if (!prof.full_name.trim()) { toast('الاسم مطلوب', 'bad'); return; }
    const row = await q(sb.from('crm_team').update({ full_name: prof.full_name.trim(), name_en: prof.name_en.trim() || null, title_ar: prof.title_ar.trim() || null, title_en: prof.title_en.trim() || null, phone: prof.phone.trim() || null }).eq('id', me.id).select().single());
    setS((x) => ({ me: row, team: x.team.map((t) => (t.id === row.id ? row : t)) })); toast('تم حفظ بياناتك');
  });
  const savePw = () => run(async () => {
    if (pw.a.length < 8) { toast('الرقم السري 8 خانات على الأقل', 'bad'); return; }
    if (pw.a !== pw.b) { toast('الرقمان غير متطابقين', 'bad'); return; }
    const { error } = await sb.auth.updateUser({ password: pw.a }); if (error) throw error;
    setPw({ a: '', b: '' }); toast('تم تغيير الرقم السري ✓');
  });
  const saveFirm = () => run(async () => {
    const keys = ['firm_name_ar', 'firm_name_en', 'tagline_ar', 'tagline_en', 'phone', 'whatsapp', 'email', 'instagram', 'website', 'address_ar', 'address_en', 'maps_url', 'profile_url', 'site_url', 'commission_rate', 'partner_id', 'followup_days', 'country_code'];
    const data = {};
    for (const k of keys) { let v = firm[k]; if (typeof v === 'string') v = v.trim(); data[k] = v === '' ? null : v; }
    data.commission_rate = Number(data.commission_rate ?? 30); data.followup_days = Number(data.followup_days || 3);
    data.country_code = String(data.country_code || '973').replace(/\D/g, '') || '973';
    for (const k of ['firm_name_ar', 'firm_name_en', 'tagline_ar', 'tagline_en']) if (!data[k]) delete data[k];
    const row = await q(sb.from('crm_settings').update(data).eq('id', 1).select().single());
    setS({ settings: row }); toast('تم حفظ إعدادات المكتب');
  });
  const setActive = (m) => run(async () => {
    if (m.id === me.id) { toast('لا يمكنك تعطيل حسابك', 'bad'); return; }
    const row = await q(sb.from('crm_team').update({ active: !m.active }).eq('id', m.id).select().single());
    setS((x) => ({ team: x.team.map((t) => (t.id === row.id ? row : t)) }));
  });
  const migrate = () => run(async () => { const r = await apiCall('/api/admin', { action: 'migrate' }); toast(`قاعدة البيانات محدّثة ✓ (الإصدار ${r.status?.version ?? '-'})`); await refresh(false); });
  const logout = async () => { await sb.auth.signOut(); location.hash = ''; };
  const ff = (k) => ({ value: firm[k] ?? '', onInput: (e) => setFirm({ ...firm, [k]: e.target.value }) });

  return html`<div class="page">
    <${PageHead} title="الإعدادات" />
    <div class="grid two" style="align-items:start">
      <div class="stack">
        <section class="card">
          <div class="card-title"><${Avatar} m=${me} /> بياناتي (تظهر في توقيع الخطابات)</div>
          <div class="row2"><${Field} label="الاسم بالعربية"><input class="input" value=${prof.full_name} onInput=${(e) => setProf({ ...prof, full_name: e.target.value })} /></${Field}>
            <${Field} label="الاسم بالإنجليزية"><input class="input ltr" value=${prof.name_en} onInput=${(e) => setProf({ ...prof, name_en: e.target.value })} /></${Field}></div>
          <div class="row2"><${Field} label="الصفة"><input class="input" value=${prof.title_ar} onInput=${(e) => setProf({ ...prof, title_ar: e.target.value })} /></${Field}>
            <${Field} label="الصفة بالإنجليزية"><input class="input ltr" value=${prof.title_en} onInput=${(e) => setProf({ ...prof, title_en: e.target.value })} /></${Field}></div>
          <${Field} label="رقم التواصل (يظهر في الخطاب وصفحة الشركة)"><input class="input num" type="tel" value=${prof.phone} onInput=${(e) => setProf({ ...prof, phone: e.target.value })} /></${Field}>
          <button class="btn primary" onClick=${saveProf} disabled=${busy}><${Icon} n="check" /> حفظ بياناتي</button>
        </section>
        <section class="card">

          <div class="row2"><${SecretInput} placeholder="رقم سري جديد" autocomplete="new-password" value=${pw.a} onInput=${(e) => setPw({ ...pw, a: e.target.value })} />
            <${SecretInput} placeholder="تأكيده" autocomplete="new-password" value=${pw.b} onInput=${(e) => setPw({ ...pw, b: e.target.value })} /></div>
          <button class="btn" style="margin-top:10px" onClick=${savePw} disabled=${busy}>تغيير الرقم السري</button>
