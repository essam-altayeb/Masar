:root{

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;overflow-x:clip;font-family:'Plex',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.75;color:var(--ink);background:var(--bg) url(assets/brand/marble.webp) center top/700px auto repeat;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:rgba(238,237,234,.72);z-index:-1}

img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}

[lang="en"] .ar-only,[lang="ar"] .en-only{display:none!important}

/* شريط اللغة */
.lang{position:absolute;top:calc(env(safe-area-inset-top) + 14px);inset-inline-end:14px;z-index:5;display:flex;gap:4px;background:rgba(18,17,16,.55);border:1px solid rgba(231,203,134,.25);border-radius:999px;padding:3px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lang button{border:0;background:none;color:var(--cream-2);font-size:13px;padding:4px 12px;border-radius:999px}
.lang button.on{background:var(--gold-grad);color:var(--espresso);font-weight:700}
.preview-bar{position:sticky;top:0;z-index:20;background:#5a4316;color:#fbefd2;font-size:13px;text-align:center;padding:8px 12px}

/* الواجهة */
.hero{position:relative;color:var(--cream);text-align:center;padding:calc(env(safe-area-inset-top) + 64px) 20px 44px;background:radial-gradient(900px 420px at 50% 0%,rgba(201,161,91,.30),transparent 62%),linear-gradient(180deg,rgba(18,17,16,.62),rgba(18,17,16,.92) 70%,#1c1a17),url(assets/brand/cover.webp) center 30%/cover no-repeat,#1c1a17;overflow:hidden}
.hero .emblem{width:150px;margin:0 auto;filter:drop-shadow(0 12px 26px rgba(0,0,0,.55))}
.word{font-family:'Yeseva',Georgia,serif;font-size:clamp(46px,13vw,76px);line-height:1;margin-top:6px;background:linear-gradient(180deg,#f3dc9f 0%,#d2a85a 50%,#9a7330 100%);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.hero .sub{font-size:14px;color:var(--cream-2);margin-top:8px;letter-spacing:.2px}
.tagline{font-family:'Ruqaa',serif;font-weight:700;font-size:clamp(26px,7vw,36px);color:var(--gold-hi);margin:18px 0 0;line-height:1.5}
.tagline.en{font-family:'Yeseva',Georgia,serif;font-weight:400;font-size:clamp(20px,5.4vw,28px)}
.welcome{margin:26px auto 0;max-width:520px;padding:16px 18px;border-radius:18px;background:rgba(27,26,24,.72);border:1px solid rgba(231,203,134,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.welcome .hi{font-size:13px;color:var(--cream-2)}
.welcome .co{font-size:22px;font-weight:700;color:#fff;line-height:1.4;margin-top:2px}
.welcome p{margin:8px 0 0;font-size:14px;color:#e6dcc6;line-height:1.8}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 22px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.btn.gold{background:var(--gold-grad);border:0;color:var(--espresso);box-shadow:0 8px 22px rgba(154,115,48,.35)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.dark{background:var(--espresso);border-color:var(--espresso);color:var(--gold-hi)}
.btn.line{background:transparent;color:var(--cream);border-color:rgba(231,203,134,.4)}

/* الأقسام */

section{margin-top:34px}

.band .en{font-family:'Yeseva',Georgia,serif;font-weight:400;font-size:19px;direction:ltr}
.band .sep{color:var(--gold-deep)}
.panel{background:rgba(255,255,255,.88);border-radius:22px;padding:22px 20px;box-shadow:0 1px 2px rgba(28,26,23,.06),0 0 0 1px rgba(28,26,23,.03)}
.about{font-size:16.5px;line-height:2;color:var(--ink-2);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.stat{text-align:center;padding:14px 6px;border-radius:16px;background:var(--gold-soft)}
.stat b{display:block;font-size:30px;line-height:1.1;color:var(--gold-deep);font-family:'Yeseva',Georgia,serif;font-weight:400;direction:ltr}
.stat span{font-size:13px;color:var(--ink-2)}

.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px}
.person{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.92);border-radius:20px;padding:14px;box-shadow:0 1px 2px rgba(28,26,23,.06)}

.person .nm{font-weight:700;font-size:16.5px;line-height:1.4}
.person .tt{font-size:13px;color:var(--ink-3);line-height:1.6}
.person .acts{display:flex;gap:6px;margin-top:8px}
.icon-a{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#fff;color:var(--ink)}
.icon-a.wa{color:#fff;background:var(--wa);border-color:var(--wa)}
.icon-a svg{width:18px;height:18px}

.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.area{background:rgba(255,255,255,.9);border-radius:18px;padding:16px 12px;text-align:center;box-shadow:0 1px 2px rgba(28,26,23,.05)}
.area svg{width:34px;height:34px;color:var(--gold-deep);margin:0 auto 8px;display:block}
.area b{display:block;font-size:15px}
.area span{font-size:12.5px;color:var(--ink-3);direction:ltr;display:block}

.pages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:720px){.pages{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pg{border:0;padding:0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(28,26,23,.10);position:relative;aspect-ratio:595/842}
.pg img{width:100%;height:100%;object-fit:cover}
.pg span{position:absolute;inset-inline:0;bottom:0;padding:16px 6px 6px;font-size:11.5px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(18,17,16,.82));text-align:center}
.row-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}

.services{columns:2 280px;column-gap:24px;margin:0;padding:0;list-style:none}
.services li{break-inside:avoid;display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.services li::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--gold);margin-top:11px;flex:none}
.services li small{display:block;color:var(--ink-3);font-size:12.5px;direction:ltr;text-align:start}
[lang="en"] .services li small{display:none}
.more-btn{display:block;margin:14px auto 0;border:0;background:none;color:var(--gold-deep);font-weight:600}

.journey{text-align:center;font-family:'Ruqaa',serif;font-weight:700;font-size:clamp(22px,6vw,30px);color:var(--gold-deep);margin:0}
.journey.en{font-family:'Yeseva',Georgia,serif;font-weight:400;font-size:clamp(18px,4.6vw,24px)}

.insta .ig{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);color:#fff;flex:none}
.insta .ig svg{width:28px;height:28px}
.insta b{display:block;font-size:16px}
.insta span{font-size:13px;color:var(--cream-2);direction:ltr;display:block;text-align:start}
.insta .btn{margin-inline-start:auto;min-height:42px;padding:0 16px}

.contact{display:grid;gap:10px}
.c-item{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.9);border-radius:16px;padding:12px 14px;box-shadow:0 1px 2px rgba(28,26,23,.05)}
.c-item svg{width:20px;height:20px;color:var(--gold-deep);flex:none}
.c-item .v{direction:ltr;unicode-bidi:isolate}
.free{margin-top:14px;text-align:center;padding:14px;border-radius:16px;border:1px dashed var(--gold);background:var(--gold-soft);font-weight:600;color:var(--gold-deep)}

footer{background:var(--espresso);color:var(--cream-2);text-align:center;padding:30px 16px calc(30px + env(safe-area-inset-bottom));font-size:13px;margin-top:40px}
footer .word{font-size:34px}
.sticky-cta{position:fixed;inset-inline:0;bottom:0;z-index:30;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(28,26,23,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transform:translateY(110%);transition:transform .25s ease}
.sticky-cta.show{transform:none}
.sticky-cta .btn{flex:1;min-height:46px}
@media (min-width:900px){.sticky-cta{display:none}}

.viewer{position:fixed;inset:0;z-index:50;background:#121110;overflow-y:auto;-webkit-overflow-scrolling:touch}
.viewer-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:rgba(18,17,16,.92);color:var(--cream)}
.viewer-top b{flex:1;font-size:15px}
.viewer-top button,.viewer-top a{min-height:40px;border-radius:999px;border:1px solid rgba(231,203,134,.35);background:transparent;color:var(--cream);padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.viewer-top svg{width:18px;height:18px;flex:none}
.viewer-top a{white-space:nowrap}
.viewer-top button{padding:0;width:40px;justify-content:center}
.viewer-pages{max-width:820px;margin:0 auto;padding:10px 10px 40px;display:grid;gap:12px}
.viewer-pages img{width:100%;border-radius:8px;background:#2a2723;aspect-ratio:595/842}

  document.addEventListener('click', function (e) {
    var t = e.target;
    var langBtn = t.closest('[data-lang]');
    if (langBtn) { LANG = langBtn.getAttribute('data-lang'); try { localStorage.setItem('altayeb-lang', LANG); } catch (er) { /* ignore */ } render(); return; }
    var pg = t.closest('[data-page]');
    if (pg) { openViewer(Number(pg.getAttribute('data-page')) || 0); return; }
    if (t.closest('[data-more]')) { state.showAll = !state.showAll; render(); return; }
    var ev = t.closest('[data-ev]');
    if (ev && !t.closest('.viewer')) track(ev.getAttribute('data-ev'));
  });
  window.addEventListener('scroll', function () {
    var s = document.getElementById('sticky');
    if (s) s.classList.toggle('show', window.scrollY > window.innerHeight * 0.9);
  }, { passive: true });

  render();
  load().then(function (d) { if (d) { state.data = d; render(); } track('open'); });
})();
</script>
</body>
</html>
