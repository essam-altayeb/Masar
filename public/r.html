:root{
  --espresso:#1c1a17; --espresso-2:#26231f; --cream:#f2ead8; --cream-2:#cdbb95;
  --gold:#b8873b; --gold-hi:#e7cb86; --gold-deep:#8a6424; --gold-soft:#f4ecd9;
  --gold-grad:linear-gradient(135deg,#ecd393 0%,#c9a15b 46%,#9a7330 100%);
  --bg:#eeedea; --paper:#ffffff; --paper-2:#f7f6f2; --line:#dedad2; --ink:#1c1a17; --ink-2:#57524a; --ink-3:#8a8478;
  --wa:#1d9a52; --ok:#2e7d5b; --bad:#a8432f;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:clip;font-family:'Plex',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.7;color:var(--ink);background:var(--bg)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.preview-bar{position:sticky;top:0;z-index:30;background:#5a4316;color:#fbefd2;font-size:13px;text-align:center;padding:8px 12px}

.hero{position:relative;color:var(--cream);text-align:center;padding:calc(env(safe-area-inset-top) + 56px) 18px 34px;background:radial-gradient(900px 420px at 50% 0%,rgba(201,161,91,.30),transparent 62%),linear-gradient(180deg,rgba(18,17,16,.80),rgba(18,17,16,.97)),url(assets/brand/cover.webp) center/cover no-repeat,#121110}
.lang{position:absolute;top:calc(env(safe-area-inset-top) + 14px);inset-inline-end:14px;display:flex;gap:4px;background:rgba(18,17,16,.55);border:1px solid rgba(231,203,134,.25);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:var(--cream-2);font-size:13px;padding:4px 12px;border-radius:999px}
.lang button.on{background:var(--gold-grad);color:var(--espresso);font-weight:700}
.emblem{width:92px;margin:0 auto;filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
.brand{font-size:13.5px;color:var(--cream-2);margin-top:8px;letter-spacing:.2px}
.greet{font-family:'Ruqaa',serif;font-weight:700;font-size:clamp(30px,8.4vw,42px);color:var(--gold-hi);margin:8px 0 0;line-height:1.4}
[lang="en"] .greet{font-family:'Yeseva',Georgia,serif;font-weight:400}
.intro{margin:6px auto 0;max-width:520px;font-size:14.5px;color:#e6dcc6;line-height:1.85}
.agent{display:flex;align-items:center;gap:12px;margin:20px auto 0;max-width:460px;padding:12px 14px;border-radius:18px;background:rgba(27,26,24,.72);border:1px solid rgba(231,203,134,.22);text-align:start}
.agent .av{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:var(--gold-grad);color:var(--espresso);display:grid;place-items:center;font-weight:700;font-size:18px}
.agent .who{flex:1;min-width:0}
.agent .who b{display:block;color:#fff;font-size:15.5px}
.agent .who span{font-size:12.5px;color:var(--cream-2)}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;border:1px solid rgba(231,203,134,.35);color:var(--gold-hi);background:transparent}
.ib.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.ib svg{width:20px;height:20px}

main{max-width:760px;margin:0 auto;padding:6px 14px 36px}
.count{text-align:center;color:var(--ink-3);font-size:13.5px;margin:16px 0 8px}
.prop{background:var(--paper);border-radius:22px;box-shadow:0 1px 2px rgba(28,26,23,.07),0 10px 30px rgba(28,26,23,.06);overflow:hidden;margin-top:16px}
.gal{position:relative;background:var(--paper-2)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;aspect-ratio:4/3;scroll-snap-align:center;border:0;padding:0;background:#ddd;display:block}
.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block;background:#111}
.dots{position:absolute;bottom:10px;inset-inline:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 2px rgba(0,0,0,.35)}
.dots i.on{background:#fff;width:18px;border-radius:7px}
.nph{aspect-ratio:16/9;display:grid;place-items:center;background:linear-gradient(140deg,#efe3c6,#f7f2e6)}
.nph svg{width:64px;height:64px;color:var(--gold)}
.ribbon{position:absolute;top:12px;inset-inline-start:12px;background:rgba(28,26,23,.82);color:var(--gold-hi);font-weight:700;font-size:13px;padding:4px 12px;border-radius:999px}
.pb{padding:14px 16px 16px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2)}
.tag.gold{background:var(--gold-soft);border-color:#e3cf9f;color:var(--gold-deep)}
h2{margin:8px 0 0;font-size:20px;line-height:1.35}
h2 span{font-weight:500;color:var(--ink-3);font-size:16px}
.price{margin-top:4px;font-size:24px;font-weight:700;line-height:1.3}
.price small{font-size:14px;font-weight:600;color:var(--ink-2)}
.price em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--ok);margin-inline-start:6px}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:12px 0 0;padding:0;list-style:none}
.specs li{display:flex;align-items:center;gap:7px;background:var(--paper-2);border-radius:12px;padding:7px 10px;font-size:13.5px;font-weight:600}
.specs svg{width:18px;height:18px;color:var(--gold-deep);flex:none}
.feats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.feats span{font-size:12.5px;padding:2px 10px;border-radius:999px;background:#f1efe9;color:var(--ink-2)}
.desc{margin:12px 0 0;font-size:14.5px;color:var(--ink-2);white-space:pre-wrap}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.links a{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--gold-deep);padding:6px 12px;border-radius:999px;border:1px solid #e3cf9f;background:var(--gold-soft)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;border-radius:16px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:700;color:var(--ink-2);transition:all .15s}
.act .e{font-size:20px;line-height:1.2}
.act.on{border-color:var(--gold);background:var(--gold-soft);color:var(--ink);box-shadow:0 0 0 2px rgba(184,135,59,.2)}
.act.view{background:var(--espresso);border-color:var(--espresso);color:var(--gold-hi)}
.act.view.on{background:var(--gold-grad);color:var(--espresso)}
.reasons{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.reasons button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.reasons button:hover{border-color:var(--gold)}
.thanks{margin-top:10px;font-size:13.5px;color:var(--ok);font-weight:600}
.card{background:var(--paper);border-radius:22px;padding:18px;margin-top:18px;text-align:center;box-shadow:0 1px 2px rgba(28,26,23,.07)}
.card h3{margin:0 0 4px;font-size:17px}
.card p{margin:0;color:var(--ink-3);font-size:14px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:15px}
.btn svg{width:19px;height:19px}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
footer{text-align:center;color:var(--ink-3);font-size:12.5px;padding:8px 16px calc(env(safe-area-inset-bottom) + 28px)}
footer a{color:var(--gold-deep);font-weight:600}
.skel{height:420px;border-radius:22px;margin-top:16px;background:linear-gradient(100deg,#e7e4dd 30%,#f3f1ec 50%,#e7e4dd 70%);background-size:300% 100%;animation:sh 1.3s ease-in-out infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.msg{text-align:center;padding:60px 20px;color:var(--ink-2)}
.msg b{display:block;font-size:19px;color:var(--ink);margin-bottom:6px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,9,8,.94);display:grid;place-items:center;padding:16px}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:88dvh;border-radius:10px}
.lb button{position:absolute;top:calc(env(safe-area-inset-top) + 12px);inset-inline-end:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:22px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);inset-inline:0;margin:0 auto;width:fit-content;max-width:92vw;background:var(--espresso);color:var(--cream);border:1px solid rgba(231,203,134,.35);padding:10px 16px;border-radius:14px;font-size:14px;z-index:60;box-shadow:0 18px 50px rgba(28,26,23,.3)}
.toast[hidden]{display:none}
</style>

    sofa: '<path d="M4 17.5v-5.5a2 2 0 0 1 4 0v2h8v-2a2 2 0 0 1 4 0v5.5z"/><path d="M6 10V7.5A2.5 2.5 0 0 1 8.5 5h7A2.5 2.5 0 0 1 18 7.5V10"/>',

  };
  var WA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';
  function icon(n) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICON[n] || ICON.home) + '</svg>'; }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function safeUrl(u) { return /^https:\/\//i.test(String(u || '')) || /^http:\/\/(localhost|127\.0\.0\.1)/i.test(String(u || '')) ? String(u) : ''; }
  function L() { return T[lang]; }
  function pick(map, k) { var v = map[k]; return v ? v[lang === 'en' ? 1 : 0] : ''; }
  function fmt(n) { var v = Number(n); return isFinite(v) ? v.toLocaleString('en-US', { maximumFractionDigits: v % 1 ? 3 : 0 }) : ''; }
  function waNum(raw) {
    var cc = String((data && data.brand && data.brand.country_code) || '973').replace(/\D/g, '');
    var d = String(raw || '').replace(/[٠-٩]/g, function (x) { return String(x.charCodeAt(0) - 0x0660); }).replace(/[^\d+]/g, '');
    if (!d) return '';
    if (d.charAt(0) === '+') d = d.slice(1); else if (d.slice(0, 2) === '00') d = d.slice(2); else if (d.length === 8) d = cc + d; else if (d.charAt(0) === '0') d = cc + d.replace(/^0+/, '');
    return d.length >= 8 ? d : '';
  }
  function waLink(phone, text) { var n = waNum(phone); return 'https://wa.me/' + n + (text ? '?text=' + encodeURIComponent(text) : ''); }
  function propTitle(p) {
    if (p.title) return p.title;
    var base = p.category === 'other' && p.category_other ? p.category_other : pick(CAT, p.category);
    if (p.subtype && lang === 'ar') base = (p.category === 'land' || p.category === 'building') ? base + ' ' + p.subtype : p.subtype;
    return base + ' ' + p.ref;
  }
  function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { el.hidden = true; }, 2600); }
  function agentPhone() { return (data.agent && data.agent.phone) || data.brand.whatsapp || data.brand.phone || ''; }

  function render() {
    var t = L();
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
    document.querySelectorAll('.lang button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-l') === lang); });
    var ps = data.properties || [];
    document.getElementById('brand').textContent = lang === 'en' && data.brand.name_en ? data.brand.name_en : data.brand.name;
    document.getElementById('greet').textContent = t.hi(data.client && data.client.first_name);
    document.getElementById('intro').textContent = t.intro(t.count(ps.length));
    var a = data.agent; var ph = agentPhone();
    document.getElementById('agent').innerHTML = (a || ph) ? '<div class="agent">' +
      (a && a.avatar ? '<img class="av" src="' + esc(a.avatar) + '" alt="">' : '<span class="av">' + esc(((a && a.name) || 'م').replace(/^(المحامي[ة]?)\s*/, '').charAt(0)) + '</span>') +
      '<div class="who"><b>' + esc(a ? (lang === 'en' && a.name_en ? a.name_en : a.name) : data.brand.name) + '</b><span>' + esc(a && a.title ? a.title : (lang === 'en' ? 'Real estate agent' : 'الوسيط العقاري')) + '</span></div>' +
      (ph ? '<a class="ib" href="tel:+' + waNum(ph) + '" aria-label="' + t.call + '">' + icon('phone') + '</a><a class="ib wa" href="' + waLink(ph, t.waHi) + '" target="_blank" rel="noopener" aria-label="' + t.wa + '">' + WA + '</a>' : '') +
      '</div>' : '';
    var html = '';
    ps.forEach(function (p) {
      var media = (p.media || []).filter(function (x) { return x.kind === 'photo' || x.kind === 'video'; });
      var docs = (p.media || []).filter(function (x) { return x.kind === 'doc'; });
      var gal = media.length
        ? '<div class="track" data-pid="' + esc(p.id) + '">' + media.map(function (x, i) {
            var u = safeUrl(x.url); if (!u) return '';
            return x.kind === 'video'
              ? '<div class="slide"><video src="' + esc(u) + '" controls playsinline preload="metadata"></video></div>'
              : '<button type="button" class="slide" data-full="' + esc(u) + '"><img src="' + esc(i === 0 ? u : (safeUrl(x.thumb) || u)) + '" alt="" loading="' + (i ? 'lazy' : 'eager') + '"></button>';
          }).join('') + '</div>' + (media.length > 1 ? '<div class="dots">' + media.map(function (_, i) { return '<i' + (i ? '' : ' class="on"') + '></i>'; }).join('') + '</div>' : '')
        : '<div class="nph">' + icon(p.category === 'land' ? 'land' : 'home') + '</div>';
      var st = p.status !== 'available' ? '<span class="ribbon">' + esc(t.status[p.status] || '') + '</span>' : '';
      var price = p.price == null ? t.onReq : fmt(p.price) + ' <small>' + t.bd + (p.purpose === 'rent' ? ' ' + (p.price_period === 'year' ? t.year : t.month) : '') + '</small>';
      var specs = [];
      if (p.bedrooms != null) specs.push(['bed', t.rooms(p.bedrooms)]);
      if (p.bathrooms != null) specs.push(['bath', t.baths(p.bathrooms)]);
      if (p.built_area) specs.push(['ruler', fmt(p.built_area) + ' ' + t.m2 + ' ' + t.built]);
      if (p.land_area) specs.push(['land', fmt(p.land_area) + ' ' + t.m2 + ' ' + t.land]);
      if (p.parking) specs.push(['car', t.parks(p.parking)]);
      if (p.floors) specs.push(['stairs', t.floors(p.floors)]);
      if (p.age_years != null) specs.push(['clock', t.age(p.age_years)]);
      if (p.furnished) specs.push(['sofa', pick(FURN, p.furnished)]);
      var feats = (p.features || []).map(function (f) { return '<span>✓ ' + esc(pick(FEAT, f) || f) + '</span>'; }).join('');
      var links = '';
      var vu = safeUrl(p.video_url); if (vu) links += '<a href="' + esc(vu) + '" target="_blank" rel="noopener">▶ ' + t.video + '</a>';
      docs.forEach(function (d) { var u = safeUrl(d.url); if (u) links += '<a href="' + esc(u) + '" target="_blank" rel="noopener">📐 ' + esc(d.name || t.plan) + '</a>'; });
      var r = state[p.id] || p.reaction;
      var on = { like: r === 'liked' || r === 'viewed' || r === 'offer', nope: r === 'rejected', view: r === 'viewing' || state[p.id + ':view'] };
      html += '<article class="prop" id="p-' + esc(p.id) + '">' +
        '<div class="gal">' + gal + st + '</div>' +
        '<div class="pb">' +
          '<div class="tags"><span class="tag gold">' + esc(pick(PURPOSE, p.purpose)) + '</span><span class="tag">' + esc(pick(CAT, p.category)) + '</span></div>' +
          '<h2>' + esc(propTitle(p)) + (p.area ? ' <span>· ' + esc(p.area) + '</span>' : '') + '</h2>' +
          '<div class="price"><span class="num">' + price + '</span>' + (p.negotiable && p.price != null ? '<em>' + t.negot + '</em>' : '') + '</div>' +
          (specs.length ? '<ul class="specs">' + specs.map(function (s) { return '<li>' + icon(s[0]) + '<span>' + esc(s[1]) + '</span></li>'; }).join('') + '</ul>' : '') +
          (feats ? '<div class="feats">' + feats + '</div>' : '') +
          (p.description && lang === 'ar' ? '<p class="desc">' + esc(p.description) + '</p>' : p.description ? '<p class="desc" dir="auto">' + esc(p.description) + '</p>' : '') +
          (links ? '<div class="links">' + links + '</div>' : '') +
          '<div class="acts">' +
            '<button type="button" class="act' + (on.like ? ' on' : '') + '" data-act="like" data-pid="' + esc(p.id) + '"><span class="e">👍</span>' + t.like + '</button>' +
            '<button type="button" class="act' + (on.nope ? ' on' : '') + '" data-act="dislike" data-pid="' + esc(p.id) + '"><span class="e">👎</span>' + t.nope + '</button>' +
            '<button type="button" class="act view' + (on.view ? ' on' : '') + '" data-act="viewing" data-pid="' + esc(p.id) + '"><span class="e">📅</span>' + t.view + '</button>' +
          '</div>' +
          '<div class="reasons" id="rs-' + esc(p.id) + '" hidden></div>' +
          '<div class="thanks" id="th-' + esc(p.id) + '" hidden></div>' +
        '</div></article>';
    });
    if (ph) html += '<div class="card"><h3>' + t.contact + '</h3><p>' + esc(a ? (lang === 'en' && a.name_en ? a.name_en : a.name) : '') + '</p><div class="btns"><a class="btn wa" href="' + waLink(ph, t.waHi) + '" target="_blank" rel="noopener">' + WA + t.wa + '</a><a class="btn" href="tel:+' + waNum(ph) + '">' + icon('phone') + t.call + '</a></div></div>';
    document.getElementById('main').innerHTML = html;
    var b = data.brand;
    var insta = b.instagram ? String(b.instagram).replace(/^https?:\/\/(www\.)?instagram\.com\//, '').replace(/^@/, '').replace(/[/?].*$/, '') : '';
    document.getElementById('foot').innerHTML = esc(lang === 'en' && b.name_en ? b.name_en : b.name) + (b.license_no ? ' · ' + t.lic + ' <span class="num">' + esc(b.license_no) + '</span>' : '') +
      (insta ? '<br><a href="https://instagram.com/' + esc(insta) + '" target="_blank" rel="noopener" class="num">@' + esc(insta) + '</a>' : '');
    bind();

  function bind() {
    document.querySelectorAll('.track').forEach(function (tr) {
      var dots = tr.parentNode.querySelectorAll('.dots i');
      if (!dots.length) return;
      tr.addEventListener('scroll', function () {
        var i = Math.round(Math.abs(tr.scrollLeft) / tr.clientWidth);
        dots.forEach(function (d, k) { d.classList.toggle('on', k === i); });
      }, { passive: true });
    });
    document.querySelectorAll('.slide[data-full]').forEach(function (s) {
      s.addEventListener('click', function () { var lb = document.getElementById('lb'); lb.querySelector('img').src = s.getAttribute('data-full'); lb.hidden = false; });
    });
    document.querySelectorAll('.act').forEach(function (btn) {
      btn.addEventListener('click', function () { act(btn.getAttribute('data-pid'), btn.getAttribute('data-act')); });
    });
  }

  function send(pid, action, reason) {
    if (preview) return;
    try {
      fetch('api/re-share', { method: 'POST', keepalive: true, headers: { 'content-type': 'application/json' }, body: JSON.stringify({ t: token, property_id: pid, action: action, reason: reason || null }) }).catch(function () {});
    } catch (e) { /* */ }
  }
  function act(pid, action) {
    var t = L();
    var p = (data.properties || []).filter(function (x) { return x.id === pid; })[0];
    if (!p) return;
    var th = document.getElementById('th-' + pid);
    var rs = document.getElementById('rs-' + pid);
    if (action === 'like') { state[pid] = 'liked'; send(pid, 'like'); rerenderActs(pid); th.textContent = t.thLike; th.hidden = false; rs.hidden = true; return; }
    if (action === 'dislike') {
      state[pid] = 'rejected'; send(pid, 'dislike'); rerenderActs(pid);
      rs.innerHTML = '<span style="font-size:13px;color:var(--ink-3);align-self:center">' + t.why + '</span>' + t.reasons.map(function (r, i) { return '<button type="button" data-r="' + esc(T.ar.reasons[i]) + '">' + esc(r) + '</button>'; }).join('');
      rs.hidden = false; th.hidden = true;
      rs.querySelectorAll('button').forEach(function (b) { b.addEventListener('click', function () { send(pid, 'dislike', b.getAttribute('data-r')); rs.hidden = true; th.textContent = t.thNope; th.hidden = false; }); });
      return;
    }
    if (action === 'viewing') {
      state[pid] = 'liked'; state[pid + ':view'] = true; send(pid, 'viewing'); rerenderActs(pid);
      th.textContent = t.thView; th.hidden = false; rs.hidden = true;
      var ph = agentPhone();
      if (ph && !preview) window.open(waLink(ph, t.waView(propTitle(p) + (p.area ? ' — ' + p.area : ''))), '_blank', 'noopener');
      if (preview) toast(lang === 'en' ? 'Preview — replies are not recorded' : 'معاينة — لا يُسجَّل الرد');
    }
  }
  function rerenderActs(pid) {
    var r = state[pid];
    var art = document.getElementById('p-' + pid); if (!art) return;
    art.querySelector('[data-act="like"]').classList.toggle('on', r === 'liked' || r === 'viewed' || r === 'offer');
    art.querySelector('[data-act="dislike"]').classList.toggle('on', r === 'rejected');
    art.querySelector('[data-act="viewing"]').classList.toggle('on', Boolean(state[pid + ':view']));
  }

  function showMsg(title, sub, retry) {
    document.getElementById('greet').textContent = '';
    document.getElementById('intro').textContent = '';
    document.getElementById('main').innerHTML = '<div class="msg"><b>' + esc(title) + '</b>' + esc(sub) + (retry ? '<div class="btns"><button type="button" class="btn" id="rt">' + esc(L().retry) + '</button></div>' : '') + '</div>';
    var rt = document.getElementById('rt'); if (rt) rt.addEventListener('click', load);
  }
  function load() {
    if (!token || !/^[a-z0-9]{10,40}$/.test(token)) { showMsg(L().notFound, L().notFoundSub); return; }
    fetch('api/re-share?t=' + encodeURIComponent(token) + (preview ? '&preview=1' : ''), { cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { if (res.status === 404) showMsg(L().notFound, L().notFoundSub); else showMsg(L().fail, L().failSub, true); return; }
        data = res.j;
        if (data.client && data.client.first_name) document.title = (lang === 'en' ? 'Properties for ' : 'عقارات مختارة لك يا ') + data.client.first_name;
        render();
      })
      .catch(function () { showMsg(L().fail, L().failSub, true); });
  }
  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { lang = b.getAttribute('data-l'); try { localStorage.setItem('masar-r-lang', lang); } catch (e) { /* */ } if (data) render(); else { document.documentElement.lang = lang; document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl'; } });
  });
  document.getElementById('lb').addEventListener('click', function () { this.hidden = true; });
  if (preview) document.getElementById('pv').hidden = false;
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
  load();
})();
